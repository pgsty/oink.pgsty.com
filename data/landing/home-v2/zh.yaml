sections:
  - type: hero
    data:
      eyebrow: OINK 0.5.0 · 仅依赖 Hugo · 构建期零外部请求
      title_lines:
        - 工程文档站需要的一切，
        - 一个 `hugo` 命令。
      lead: 不装 Node，不跑 npm，不连 CDN。全文检索、32 种语言、多版本、打印与 Agent 输出全部内置。
      note: 你正在看的这个站点就是用 OINK 构建的 —— 排版、搜索与命令面板都来自主题本身。
      note_icon: fa-solid fa-circle-check
      image:
        light: images/hero-light.webp
        dark: images/hero-dark.webp
        alt: OINK 工程文档插图
      actions:
        - label: 克隆这个站点开始
          url: docs/start/
          icon: fa-solid fa-arrow-right
          style: primary
        - label: 浏览 21 个组件
          url: docs/components/
          icon: fa-solid fa-cubes
          style: ghost

  - type: metrics
    key: v2-metrics
    data:
      eyebrow: 事实
      title: 不用信文案，看数字
      animate: true
      items:
        - { value: 0, label: npm 依赖 }
        - { value: 0, label: 构建期外部请求 }
        - { value: 32, label: 内置界面语言 }
        - { value: 11, label: 生产中的站点 }

  - type: command-box
    key: v2-install
    data:
      eyebrow: 安装
      title: 加一行模块依赖，没有第二步
      code: hugo mod get github.com/pgsty/oink
      lang: bash
      note: 需要 Hugo Extended ≥ 0.160.1。没有 package.json，没有 postcss.config.js，没有 node_modules。

  - type: capabilities
    key: v2-capabilities
    data:
      eyebrow: 为什么是它
      title: 四件别处拿不到的事
      items:
        - ref: 01 / 源码可读
          title: 组件就是 Markdown 本身
          url: docs/components/
          motto: 在 GitHub 上、在任何编辑器里，源码都还是能读的
          bullets:
            - '提示块是 `> [!NOTE]` 块引用，步骤是列表加 `{.steps}`，标签页是相邻围栏加 `{tab=}`'
            - '29 个 shortcode 只留给原生块表达不了的场景'
            - '换掉主题，内容仍是标准 Markdown，不是 MDX 方言'
          value: 内容资产不绑死在主题上，迁移成本始终可控。
          visual:
            type: code
            aria_label: Markdown 原生组件示例
            title: guide.md
            lines:
              - { class: c, prefix: '', text: '> [!WARNING] 先备份' }
              - { class: c, prefix: '', text: '> 升级会重写配置键。' }
              - { class: p, prefix: '', text: '' }
              - { class: p, prefix: '', text: '1. 停止服务' }
              - { class: p, prefix: '', text: '2. 执行迁移' }
              - { class: ok, prefix: '', text: '{.steps}' }
        - ref: 02 / 离线可构建
          title: 构建期不联网，宁可失败也不偷偷请求
          url: docs/about/features/
          motto: 断网、内网与审计环境里都能构建出完整站点
          bullets:
            - 'CSS、JavaScript、字体与图表运行时共 26 项全部随主题分发'
            - '需要外部端点的功能没配端点就**让构建失败**，主题不会替你连公共服务'
            - '开发、CI 与生产走同一条确定性构建路径'
          value: 合规环境不必为一个文档站单独开网络白名单。
          visual:
            type: code
            aria_label: Hugo 构建示例
            title: build.sh
            lines:
              - { class: c, prefix: '# ', text: 一条命令，一份确定性输出 }
              - { class: p, prefix: '$ ', text: hugo --gc --minify }
              - { class: ok, prefix: '✓ ', text: 本地资源已打包，无外部请求 }
              - { class: ok, prefix: '✓ ', text: 多语言路由已生成 }
              - { class: ok, prefix: '✓ ', text: public/ 可以部署 }
        - ref: 03 / 一份内容四种输出
          title: 同一页，给人读也给模型读
          url: docs/customize/agents/
          motto: HTML、打印、Markdown、RSS，外加 llms.txt
          bullets:
            - '每个组件在四种输出下都有确定形态，不是「打印时凑合一下」'
            - '`llms.txt` 与 `.md` 输出让 Agent 直接消费文档，不必爬 HTML'
            - '打印视图去掉交互、展开折叠，整本书可以一次印出'
          value: 一份内容同时服务读者、搜索引擎与 AI 工具。
          visual:
            type: components
            aria_label: 四种输出形态
            columns: 2
            items:
              - { icon: fa-solid fa-globe, title: HTML, detail: 交互外壳 }
              - { icon: fa-solid fa-print, title: 打印, detail: 整本可印 }
              - { icon: fa-brands fa-markdown, title: Markdown, detail: 源码级输出 }
              - { icon: fa-solid fa-robot, title: llms.txt, detail: Agent 索引 }
        - ref: 04 / 不是玩具
          title: 大型双语站点已经在用
          url: docs/about/showcase/
          motto: 全文检索、多版本、分类法、书籍编号，一样不缺
          bullets:
            - '本地 Lunr 检索带中文子串兜底，命令面板 ⌘K 直达'
            - '版本菜单与归档横幅，每个版本是一次独立构建'
            - 'Book 模式：编号图表式例、交叉引用、索引与整本打印'
          value: 功能底座继承自 Docsy 十年的沉淀，外壳与组件是 OINK 自己的。
          visual:
            type: shell
            brand: OINK
            search: 搜索内容或执行命令
            shortcut: ⌘ K
            section: 文档
            section_icon: fa-solid fa-book
            items:
              - { label: 快速上手, active: true }
              - { label: 创作内容 }
              - { label: 组件参考 }
              - { label: 定制站点 }
            eyebrow: 工程文档 / 长期维护
            title_lines: [大站也能, 快速穿行。]
            rules: ['88%', '72%', '55%']

  - type: pricing-compare
    key: v2-compare
    data:
      eyebrow: 选型
      title: 三条技术路线，代价各不相同
      desc: 按交付方式而不是按产品名比较；每一行都是结构性差异，不是功能多寡。
      tiers: [Hugo 单二进制（OINK）, Node 工具链, 托管服务]
      groups:
        - name: 构建
          rows:
            - { name: 无需 Node / npm, cells: [Y, N, '—'] }
            - { name: 单个可执行文件完成构建, cells: [Y, N, '—'] }
            - { name: 断网环境可构建, cells: [Y, N, N] }
        - name: 归属
          rows:
            - { name: 产物是你自己的静态文件, cells: [Y, Y, N] }
            - { name: 内容是标准 Markdown, cells: [Y, N, N] }
        - name: 长期维护
          rows:
            - { name: 依赖树需要定期升级, cells: [N, Y, '—'] }
            - { name: 供应商停服的风险, cells: [N, N, Y] }

  - type: logo-wall
    key: v2-sites
    data:
      eyebrow: 已经在生产环境
      title: 11 个站点，最大的一个有一千四百多个 Markdown 文件
      layout: grid
      items:
        - { title: pigsty.io, icon: fa-solid fa-database, url: 'https://pigsty.io/' }
        - { title: pigsty.cc, icon: fa-solid fa-database, url: 'https://pigsty.cc/' }
        - { title: pig.pgsty.com, icon: fa-solid fa-box, url: 'https://pig.pgsty.com/' }
        - { title: silo.pgsty.com, icon: fa-solid fa-hard-drive, url: 'https://silo.pgsty.com/' }
        - { title: exp.pgsty.com, icon: fa-solid fa-chart-line, url: 'https://exp.pgsty.com/' }
        - { title: pgsql.cc, icon: fa-solid fa-server, url: 'https://pgsql.cc/' }
        - { title: pgsty.com, icon: fa-solid fa-building, url: 'https://pgsty.com/' }
        - { title: oink.pgsty.com, icon: fa-solid fa-book, url: 'https://oink.pgsty.com/' }

  - type: steps
    key: v2-steps
    data:
      eyebrow: 上手
      title: 三步得到一个双语文档站
      items:
        - title: 克隆
          desc: 这个文档站本身就是可运行的双语 starter，不是空模板。
          cmd: { code: 'git clone https://github.com/pgsty/oink.pgsty.com my-docs' }
        - title: 改三处
          desc: 站点名、`baseURL`、顶栏菜单；再把示例内容换成你自己的。
          cmd: { code: 'hugo server' }
        - title: 发布
          desc: GitHub Pages 工作流已经写好，推上去即可。
          cmd: { code: 'hugo --gc --minify' }

  - type: faq
    key: v2-faq
    data:
      eyebrow: 选型顾虑
      title: 决定之前你大概会问
      style: accordion
      items:
        - question: 我已经在用 Docsy，迁移成本多大？
          answer: OINK 是 Docsy 的硬分叉，保留了 `td-` 命名、Sass 变量与绝大多数配置键，站点覆盖基本原样可用。内容语法的变更有一个可干跑、幂等的迁移脚本；改过名的配置键会让构建失败并直接告诉你新名字，升级就是照着报错逐条改。
        - question: 不写前端，还能定制外观吗？
          answer: 品牌色、字体与排版是 SCSS 变量和 CSS 自定义属性，站点在自己的 `_variables_project.scss` 里覆盖即可。字体整体切换只要一个参数。这条路径不需要 Node，也不需要构建步骤。
        - question: 需要写 React 或 MDX 组件吗？
          answer: 不需要。组件的第一形态是 Markdown 语法本身加一行属性；原生形态表达不了的场景才用 shortcode，一共 29 个。内容里不会出现 JSX。
        - question: 页面会不会因为组件多而变重？
          answer: 不会。脚本按每一页实际用到的组件拼包，没用到的运行时不下发；打印、Markdown 与 RSS 输出不加载任何脚本。公式在构建期渲染完毕，页面上只多一份样式表与字体。
        - question: 维护状态如何？
          answer: 0.5.0 是组件 API v5 与配置键收敛的版本，1.0 之前把公开 API 定死。11 个生产站点在跟随主线，主题仓库有源码级契约检查、四态输出金样本与浏览器运行时测试。

  - type: cta
    key: v2-cta
    data:
      title: 克隆这个站点，改三处配置，剩下的交给 Hugo。
      text: 双语、可检索、可打印、可被 Agent 读取 —— 从第一次构建就是完整的。
      label: 开始使用
      url: docs/start/
      style: primary
