sections:
  - type: hero
    data:
      eyebrow: OINK 0.5.0 · Hugo only · zero network calls at build time
      title_lines:
        - Everything a technical docs site needs,
        - in one `hugo` command.
      lead: No Node, no npm, no CDN. Full-text search, 32 locales, versioning, print, and agent-readable output are built in.
      note: This site is built with OINK — the shell, the search, and the command palette all come from the theme.
      note_icon: fa-solid fa-circle-check
      image:
        light: images/hero-light.webp
        dark: images/hero-dark.webp
        alt: OINK engineering documentation illustration
      actions:
        - label: Clone this site
          url: docs/start/
          icon: fa-solid fa-arrow-right
          style: primary
        - label: Browse 21 components
          url: docs/components/
          icon: fa-solid fa-cubes
          style: ghost

  - type: metrics
    key: v2-metrics
    data:
      eyebrow: Facts
      title: Don't take the copy's word for it
      animate: true
      items:
        - { value: 0, label: npm dependencies }
        - { value: 0, label: build-time network calls }
        - { value: 32, label: bundled locales }
        - { value: 11, label: sites in production }

  - type: command-box
    key: v2-install
    data:
      eyebrow: Install
      title: One module line, and that is the whole setup
      code: hugo mod get github.com/pgsty/oink
      lang: bash
      note: Requires Hugo Extended ≥ 0.160.1. No package.json, no postcss.config.js, no node_modules.

  - type: capabilities
    key: v2-capabilities
    data:
      eyebrow: Why this one
      title: Four things you will not get elsewhere
      items:
        - ref: 01 / Readable source
          title: The components are Markdown itself
          url: docs/components/
          motto: The source still reads on GitHub and in any editor
          bullets:
            - 'Callouts are `> [!NOTE]` blockquotes, steps are a list plus `{.steps}`, tabs are adjacent fences plus `{tab=}`'
            - 'The 29 remaining shortcodes cover only what a native block cannot express'
            - 'Swap the theme out and the content is still standard Markdown, not an MDX dialect'
          value: Your content is not welded to the theme, so migration stays affordable.
          visual:
            type: code
            aria_label: Native Markdown component example
            title: guide.md
            lines:
              - { class: c, prefix: '', text: '> [!WARNING] Back up first' }
              - { class: c, prefix: '', text: '> The upgrade rewrites config keys.' }
              - { class: p, prefix: '', text: '' }
              - { class: p, prefix: '', text: '1. Stop the service' }
              - { class: p, prefix: '', text: '2. Run the migration' }
              - { class: ok, prefix: '', text: '{.steps}' }
        - ref: 02 / Builds offline
          title: No network at build time — it fails rather than phone home
          url: docs/about/features/
          motto: Air-gapped, internal, and audited environments build the full site
          bullets:
            - 'All 26 vendored runtimes — CSS, JavaScript, fonts, chart engines — ship with the theme'
            - 'Features that need an external endpoint **fail the build** when none is configured; the theme never reaches for a public service on your behalf'
            - 'Development, CI, and production follow one deterministic build path'
          value: A compliance environment needs no network allowlist for its docs site.
          visual:
            type: code
            aria_label: Hugo build example
            title: build.sh
            lines:
              - { class: c, prefix: '# ', text: one command, one deterministic output }
              - { class: p, prefix: '$ ', text: hugo --gc --minify }
              - { class: ok, prefix: '✓ ', text: local assets bundled, no external calls }
              - { class: ok, prefix: '✓ ', text: multilingual routes generated }
              - { class: ok, prefix: '✓ ', text: public/ ready to deploy }
        - ref: 03 / One source, four outputs
          title: The same page, for readers and for models
          url: docs/customize/agents/
          motto: HTML, print, Markdown, RSS — plus llms.txt
          bullets:
            - 'Every component has a defined shape in all four outputs, not a best-effort print fallback'
            - '`llms.txt` and the `.md` output let agents consume the docs without scraping HTML'
            - 'Print strips interaction, expands disclosures, and prints a whole book in one pass'
          value: One body of content serves readers, search engines, and AI tooling alike.
          visual:
            type: components
            aria_label: Four output formats
            columns: 2
            items:
              - { icon: fa-solid fa-globe, title: HTML, detail: interactive shell }
              - { icon: fa-solid fa-print, title: Print, detail: whole-book export }
              - { icon: fa-brands fa-markdown, title: Markdown, detail: source-level output }
              - { icon: fa-solid fa-robot, title: llms.txt, detail: agent index }
        - ref: 04 / Not a toy
          title: Large bilingual sites already run on it
          url: docs/about/showcase/
          motto: Search, versioning, taxonomy, and book numbering all included
          bullets:
            - 'Local Lunr search with a CJK substring fallback; ⌘K opens the command palette'
            - 'Version menu and archive banner; each version is its own independent build'
            - 'Book mode: numbered figures, tables, equations, examples, cross-references, and indexes'
          value: The feature base comes from a decade of Docsy; the shell and the components are OINK's own.
          visual:
            type: shell
            brand: OINK
            search: Search or run a command
            shortcut: ⌘ K
            section: Docs
            section_icon: fa-solid fa-book
            items:
              - { label: Get started, active: true }
              - { label: Authoring }
              - { label: Components }
              - { label: Customization }
            eyebrow: Engineering docs / long haul
            title_lines: [Large sites, stay navigable.]
            rules: ['88%', '72%', '55%']

  - type: pricing-compare
    key: v2-compare
    data:
      eyebrow: Evaluating
      title: Three delivery models, three different bills
      desc: Compared by delivery model rather than by product name; every row is a structural difference, not a feature count.
      tiers: [Hugo single binary (OINK), Node toolchain, Hosted service]
      groups:
        - name: Build
          rows:
            - { name: No Node / npm required, cells: [Y, N, '—'] }
            - { name: One executable does the build, cells: [Y, N, '—'] }
            - { name: Builds with no network, cells: [Y, N, N] }
        - name: Ownership
          rows:
            - { name: The output is your own static files, cells: [Y, Y, N] }
            - { name: The content is standard Markdown, cells: [Y, N, N] }
        - name: Long haul
          rows:
            - { name: Dependency tree needs regular upgrades, cells: [N, Y, '—'] }
            - { name: Exposed to a vendor shutting down, cells: [N, N, Y] }

  - type: logo-wall
    key: v2-sites
    data:
      eyebrow: Already in production
      title: 11 sites; the largest carries over 1,400 Markdown files
      layout: grid
      items:
        - { title: pigsty.io, icon: fa-solid fa-database, url: 'https://pigsty.io/' }
        - { title: pigsty.cc, icon: fa-solid fa-database, url: 'https://pigsty.cc/' }
        - { title: pig.pgsty.com, icon: fa-solid fa-box, url: 'https://pig.pgsty.com/' }
        - { title: silo.pgsty.com, icon: fa-solid fa-hard-drive, url: 'https://silo.pgsty.com/' }
        - { title: exp.pgsty.com, icon: fa-solid fa-chart-line, url: 'https://exp.pgsty.com/' }
        - { title: pgsql.cc, icon: fa-solid fa-server, url: 'https://pgsql.cc/' }
        - { title: pgsty.com, icon: fa-solid fa-building, url: 'https://pgsty.com/' }
        - { title: oink.pgsty.com, icon: fa-solid fa-book, url: 'https://oink.pgsty.com/' }

  - type: steps
    key: v2-steps
    data:
      eyebrow: Get started
      title: A bilingual docs site in three steps
      items:
        - title: Clone
          desc: This documentation site is the starter — a running bilingual site, not an empty template.
          cmd: { code: 'git clone https://github.com/pgsty/oink.pgsty.com my-docs' }
        - title: Change three things
          desc: Site title, `baseURL`, and the navbar menu; then replace the sample content with yours.
          cmd: { code: 'hugo server' }
        - title: Publish
          desc: The GitHub Pages workflow is already written — push and it deploys.
          cmd: { code: 'hugo --gc --minify' }

  - type: faq
    key: v2-faq
    data:
      eyebrow: Before you commit
      title: What you are probably about to ask
      style: accordion
      items:
        - question: I already run Docsy — how expensive is the move?
          answer: OINK is a hard fork of Docsy and keeps the `td-` naming, the Sass variables, and most configuration keys, so existing site overrides usually work as they are. Content-syntax changes have a dry-runnable, idempotent migration script, and every renamed configuration key fails the build naming its replacement, so upgrading means following the errors one at a time.
        - question: Can I restyle it without writing front-end code?
          answer: Brand colours, fonts, and typography are Sass variables and CSS custom properties; a site overrides them in its own `_variables_project.scss`. Switching the whole type system is one parameter. None of this path needs Node or a build step.
        - question: Do I have to write React or MDX components?
          answer: No. A component's first form is Markdown syntax plus one attribute line; shortcodes — 29 of them — cover only what a native block cannot express. No JSX ever appears in your content.
        - question: Do all these components make pages heavy?
          answer: No. Scripts are bundled per page from the components that page actually uses; unused runtimes are never shipped. Print, Markdown, and RSS output load no JavaScript at all, and maths is rendered at build time, costing one stylesheet and its fonts.
        - question: How actively is it maintained?
          answer: 0.5.0 is the component API v5 and configuration convergence release; the public API freezes at 1.0. Eleven production sites track the main line, and the theme repository carries source-level contract checks, four-state output goldens, and browser runtime tests.

  - type: cta
    key: v2-cta
    data:
      title: Clone this site, change three settings, and let Hugo do the rest.
      text: Bilingual, searchable, printable, agent-readable — complete from the first build.
      label: Get started
      url: docs/start/
      style: primary
