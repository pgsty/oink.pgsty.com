# ------------------------------------------------------------ timeline ------
releases:
  eyebrow: 轨迹
  title: 从 Docsy 分叉到组件 API v5
  text: >-
    OINK 从 Docsy 分叉而来，之后独立演化。每个版本都有发布说明，
    每次迁移都是一段先报告、再改写的脚本。
  items:
    - date: 2026-08-08
      title: 0.1.0 —— 稳定的本地优先基础
      desc: 保留 Docsy 的内容模型；替换外壳、导航、检索与交付方式。所有资源随主题分发。
      url: /zh/blog/release/0.1.0/   # timeline 原样输出 href，因此写绝对路径
    - date: 2026-08-10
      title: 0.2.0 —— 更丰富的内容与更精致的呈现
      desc: 增强代码块，图示与图表成为本地运行时，第一批 Markdown 原生组件形态。
      url: /zh/blog/release/0.2.0/
    - date: 2026-08-12
      title: 0.3.0 —— 写作、导航与更轻的页面
      desc: 命令面板、键盘导航与页面动作；按页面下发、更小的 JavaScript。
      url: /zh/blog/release/0.3.0/
    - date: 2026-08-14
      title: 0.4.0 —— 面向完整发布流程的场景组件
      desc: 书籍、发布与下载、Landing 页与顺序阅读一并发布，附迁移脚本。
      url: /zh/blog/release/0.4.0/
    - date: 2026-08-18
      title: 0.5.0 —— 组件 API v5 与收敛后的配置
      desc: 每个内容原语都有原生形态，一套属性策略，一个命名空间，旧键让构建失败并给出新名字。
      url: /zh/blog/release/0.5.0/

# ---------------------------------------------------------- principles ------
principles:
  eyebrow: 原则
  title: 版本更迭中不变的事
  columns: 4
  items:
    - icon: fa-solid fa-plug-circle-xmark
      title: 本地优先，宁可失败
      desc: >-
        浏览器需要的一切随主题分发。可能需要联网的功能，站点不显式配置就构建失败。
    - icon: fa-brands fa-markdown
      title: Markdown 是唯一事实来源
      desc: >-
        组件先有 Markdown 原生形态，再有 shortcode，所以有没有主题内容都能正确阅读。
    - icon: fa-solid fa-sliders
      title: 由站点决定
      desc: >-
        输出、检索、评论、缩放与 AI 助手链接都要站点主动打开。站点拥有自己的内容、
        品牌与业务组件，主题只负责外壳。
    - icon: fa-solid fa-triangle-exclamation
      title: 显式胜过静默
      desc: >-
        改名的键与移除的 shortcode 会让构建失败并给出替代写法。迁移是先报告、
        再改写的脚本。

# ----------------------------------------------------------------- faq ------
faq:
  eyebrow: 选型之前
  title: 值得先问的几个问题
  items:
    - question: 哪里需要 Node.js、npm 或打包器吗？
      answer: >-
        不需要。消费站点的构建依赖是 Hugo Extended（0.160.1 或更新版本）。
        Go 只用一次，用来把主题解析为 Hugo Module；离线归档或 Git submodule
        方式则连 Go 也不需要。界面交互仍在浏览器里执行 JavaScript——检索、面板、
        图表、标签页——但这些脚本随主题分发，只挂在用到它们的页面上。
      open: true
    - question: 我有一个 Docsy 站，迁移有多难？
      answer: >-
        OINK 保留了 Docsy 的内容模型与多语言行为，内容与 front matter 大多可以直接沿用；
        替换的是外壳、导航、检索与组件。改名的键会让构建失败并给出新名字，
        `scripts/migrations/oink06.py` 在改写之前先报告它会改什么。见[升级与迁移](docs/admin/upgrade/)。
    - question: OINK 只适合大型文档树吗？
      answer: >-
        不是。[示例站点](docs/about/showcase/)里既有两页的项目站，也有一千五百个文件的
        发行版手册，还有一个只用 OINK 做落地页的公司站。外壳向下缩放和向上扩展一样自然。
    - question: 中文与其它非拉丁文字的内容怎么处理？
      answer: >-
        本地检索对拉丁文字用 Lunr、对中日韩文本用子串回退，中文与日文页面无需托管服务
        也能搜索。英语、简体中文（`zh-cn`、`zh`）与繁体中文（`zh-tw`）的界面文案经过人工审校，
        另外 29 种语言共用同一套 key。支持 RTL 布局。
    - question: AI 助手与爬虫拿到的是什么？
      answer: >-
        `outputs` 里加上 `markdown`，每个页面就有一份 `index.md`，由 `rel="alternate"`
        指过去；`LLMS` 输出格式在站点根目录写出 `llms.txt`——本站的在 `/zh/llms.txt`。
        「在 ChatGPT / Claude 中打开」这类页面动作存在，但默认关闭，因为它会把读者的
        URL 交给第三方。
    - question: 许可证是什么？和 Docsy 是什么关系？
      answer: >-
        Apache License 2.0。OINK 是 Docsy 的分叉并独立演化；Docsy 的源码历史、署名与
        Apache-2.0 义务完整保留，每个随主题分发的运行时都在 `VENDOR.json` 里连同许可证列出。
        见[开源许可与致谢](docs/about/license/)。

