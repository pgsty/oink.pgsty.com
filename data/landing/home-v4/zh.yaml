# OINK 首页第四版（只有站点数据，不改主题）。
#
# 下面每个分区都是 OINK 0.5.0 自带的 landing 分区（hero、metrics、
# capabilities、cards、logo-wall、steps、code-plate、pricing-compare、
# bar-chart、case-study、timeline、principles、faq、cta），全部由本文件驱动。
# 所有数字与说法都取自本站文档（docs/about/、docs/about/features/、
# docs/about/showcase/），读者可以逐条核对。
#
# 叙事顺序：承诺 → 证据 → 四个理由 → 里面有什么 → 横向对比 →
# 谁在用 → 怎么开始 → 原则 → 常见问题 → 行动号召。

sections:
  - hero
  - { type: metrics,         key: facts }
  - { type: capabilities,    key: why }
  - { type: cards,           key: content_types }
  - { type: logo-wall,       key: components }
  - { type: steps,           key: start }
  - { type: code-plate,      key: config }
  - { type: pricing-compare, key: compare }
  - { type: bar-chart,       key: scale }
  - { type: logo-wall,       key: production }
  - { type: case-study,      key: migration }
  - { type: timeline,        key: releases }
  - { type: principles,      key: principles }
  - { type: faq,             key: faq }
  - { type: cta,             key: cta }

# ---------------------------------------------------------------- hero ------
hero:
  eyebrow: OINK 0.5.0 · Open · Indexed · Navigable · Knowledge
  title_lines:
    - 技术文档站，
    - 只需要一个 Hugo。
  title_size: 4.4rem
  lead: >-
    OINK 把一棵 Markdown 目录树变成完整的文档系统：文档、博客、书籍、发布页与
    API 参考，内置本地全文检索、32 种界面语言、多版本、打印视图与面向 AI
    助手的输出。构建依赖只有 Hugo Extended——没有 Node.js、没有 npm、
    没有 CDN，构建期不需要联网。
  note: >-
    这一页本身就是一份 YAML 文件，由主题自带的 landing 分区渲染，
    没有为它写过任何模板。
  note_icon: fa-solid fa-file-code
  image:
    light: images/hero-light.webp
    dark: images/hero-dark.webp
    alt: Markdown 内容、配置与随主题分发的资源经过一次 Hugo 构建汇成静态文档站
  actions:
    - label: 十分钟上手
      url: docs/start/
      icon: fa-solid fa-rocket
      style: primary
    - label: 组件总览
      url: docs/components/
      icon: fa-solid fa-cubes
      style: ghost
    - label: GitHub
      url: https://github.com/pgsty/oink
      icon: fa-brands fa-github
      style: ghost
      external: true
  detail:
    label: 0.5.0 有什么变化 —— 组件 API v5 与收敛后的配置
    url: blog/release/0.5.0/
    icon: fa-solid fa-newspaper

