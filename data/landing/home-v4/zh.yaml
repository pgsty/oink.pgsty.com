# -------------------------------------------------------- capabilities ------
why:
  eyebrow: 为什么是 OINK
  title: 四件普通 Hugo 主题通常给不了你的事
  text: >-
    多数文档主题只是一层皮。OINK 是一套文档<em>系统</em>：写作模型、阅读外壳、
    输出矩阵与交付方式一起设计，每一项都能在本站验证。
  items:
    - ref: 01 / MARKDOWN 原生
      title: 组件写在 Markdown 里，而不是另一套模板语言
      url: docs/components/
      motto: 在 GitHub 上可读，在站点上完整。
      bullets:
        - >-
          [提示块](docs/components/callout/)是 `> [!NOTE]` 块引用，
          [步骤](docs/components/steps/)与[卡片](docs/components/cards/)是列表加
          `{.steps}` / `{.cards}`，[参数表](docs/components/fields/)是表格加一行
          `{.fields}`，[图注](docs/components/image/)是图片下面一行 `{caption="…"}`。
        - >-
          [标签页](docs/components/tabs/)是几个相邻围栏各带一个 `{tab="…"}`；
          [文件树](docs/components/filetree/)、[画廊](docs/components/gallery/)、
          [Mermaid](docs/components/mermaid/) 与 [ECharts](docs/components/echarts/)
          是以语言命名的数据围栏。
        - >-
          29 个 shortcode 覆盖原生形态表达不了的场景，而且每一个都在构建期校验参数：
          写错一个键名是构建错误，不是页面上悄悄缺一块。
      value: >-
        内容离开主题也活得下去：在 GitHub 或任何 Markdown 阅读器里，它退化为块引用、
        表格、列表与代码块。什么都不丢，也不被锁定。
      visual:
        type: code
        title: guide.md
        aria_label: 含提示块、步骤列表与标签页的 Markdown 源码
        lines:
          - { class: k,  prefix: '> ', text: '[!TIP] 只需一行属性' }
          - { class: c,  prefix: '> ', text: '提示块、步骤与标签页仍然是普通 Markdown。' }
          - { text: '' }
          - { class: p,  prefix: '1. ', text: '写 Markdown' }
          - { class: p,  prefix: '2. ', text: '运行 hugo' }
          - { class: p,  prefix: '3. ', text: '部署 public/' }
          - { class: k,  text: '{.steps}' }
          - { text: '' }
          - { class: s,  text: '```bash {tab="macOS"}' }
          - { text: 'brew install hugo' }
          - { class: s,  text: '```' }
          - { class: s,  text: '```bash {tab="Linux"}' }
          - { text: 'apt install hugo' }
          - { class: s,  text: '```' }
    - ref: 02 / 只要 HUGO · 本地优先
      title: 一个二进制构建一切，而且离线
      url: docs/about/features/
      motto: 没有 Node，没有 npm，没有 CDN；宁可构建失败，也不偷偷连出去。
      bullets:
        - >-
          消费站点的构建依赖只有 [Hugo Extended 0.160.1 或更新版本](docs/start/)。
          SCSS 由 Hugo 内置编译，没有 PostCSS、没有 webpack、没有构建期下载。
        - >-
          Bootstrap、Font Awesome、四款字体、Lunr、Mermaid、KaTeX、Markmap、
          Swagger UI、Redoc、Asciinema、ECharts——[28 个运行时](docs/about/license/)
          全部提交在主题仓库，`VENDOR.json` 逐项记录版本、来源、许可证与 SHA-256，
          并且只在用到它的页面下发。
        - >-
          凡是可能引起网络请求的功能——PlantUML 服务器、draw.io 服务器、
          Algolia 密钥——站点不显式配置就构建失败。没有任何东西会自作主张连出去。
      value: >-
        从笔记本到 CI 再到生产，只有一条确定性的路径。不能出网的构建机是被支持的场景，
        不是边缘情况。
      visual:
        type: code
        title: ci.log
        aria_label: 消费站点的构建日志
        lines:
          - { class: p,  prefix: '$ ', text: 'hugo --gc --minify' }
          - { class: ok, prefix: '✓ ', text: '0 个 npm 包，构建期 0 次网络请求' }
          - { class: ok, prefix: '✓ ', text: '28 个随主题分发的运行时校验通过（VENDOR.json）' }
          - { class: ok, prefix: '✓ ', text: '2 种语言 · 每种语言一份检索索引' }
          - { class: ok, prefix: '✓ ', text: 'HTML · 打印 · Markdown · llms.txt' }
          - { class: c,  prefix: '# ', text: 'public/ 已就绪——放到任何地方托管' }
    - ref: 03 / 面向大站的阅读外壳
      title: 一千五百页也撑得住的导航
      url: docs/customize/navigation/
      motto: 侧栏树、页内目录、⌘K 命令面板、键盘、检索——文档、博客、书籍共用一套外壳
      bullets:
        - >-
          [本地全文检索](docs/customize/search/)：拉丁文字用 Lunr，中日韩文本用子串回退，
          查询内容不离开浏览器。页面可以用 `search_boost` 调权重、`search_keywords`
          补同义词。
        - >-
          [命令面板](docs/customize/panel/)——`⌘K` 打开，`/` 进入搜索，`\` 进入命令——
          加上[单键导航](docs/customize/keyboard/)：`w s a d` 在树上移动，`q e`
          上下篇，`j k` 沿目录跳转，`t` 切主题，`l` 切语言。
        - >-
          [32 种界面语言](docs/customize/i18n/)、缺译回退与 RTL，
          带归档横幅的[版本菜单](docs/customize/versions/)，深色模式、面包屑、翻页、
          打印视图——全部是外壳的一部分，没有一样是插件。
      value: >-
        读者的偏好——主题、语言、侧栏宽度、面板历史——存在浏览器里，不发往任何地方。
      visual:
        type: shell
        brand: OINK
        search: 搜索或运行命令
        shortcut: ⌘ K
        section: 文档
        section_icon: fa-solid fa-book
        items:
          - { label: 简介 }
          - { label: 十分钟上手, active: true }
          - { label: 写作 }
          - { label: 组件 }
          - { label: 定制 }
          - { label: 运维 }
        eyebrow: 技术文档 / 长期维护
        title_lines: [站点再大，, 也能走得动。]
        rules: ['88%', '72%', '55%']
    - ref: 04 / 一份内容 · 四种输出
      title: 同一页面，同时面向读者、纸张、搜索引擎与 AI
      url: docs/customize/agents/
      motto: HTML · 打印 · Markdown · llms.txt——每个组件在四种输出下都有确定的形态
      bullets:
        - >-
          交互式 HTML 给读者；[打印视图](docs/customize/print/)按栏目或整本书生成，
          去掉控件、展开折叠块。
        - >-
          每个页面旁边多一份 `index.md`，`<head>` 里用 `rel="alternate"` 指过去；
          站点根目录再生成一份 [`llms.txt`](docs/customize/agents/) 清单——同样的内容，
          换成 AI 助手最好读的形式。
        - >-
          用哪几种输出由站点在 `outputs` 里决定，主题从不替站点决定；
          「在 ChatGPT / Claude 中打开」默认关闭，因为它会把当前 URL 交给第三方。
      value: >-
        写一次，同时交付给浏览器、PDF、Markdown 阅读器与 AI 助手——一次构建，
        没有第二套工具链。
      visual:
        type: components
        aria_label: 四种输出格式
        columns: 2
        items:
          - { icon: fa-solid fa-globe,       title: HTML,      detail: 交互式阅读外壳 }
          - { icon: fa-solid fa-print,       title: 打印,      detail: 按栏目或整本书, url: docs/customize/print/ }
          - { icon: fa-brands fa-markdown,   title: Markdown,  detail: 每页旁边一份 index.md, url: docs/customize/agents/ }
          - { icon: fa-solid fa-robot,       title: llms.txt,  detail: 给 AI 助手的站点清单, url: docs/customize/agents/ }

# --------------------------------------------------------------- cards ------
content_types:
  eyebrow: 不止文档
  title: 六类内容，一套主题
  text: >-
    文档站很少只有文档。那些通常需要第二个工具的内容形态在这里是内置的，
    并且共用同一个外壳、同一份检索索引、同一组语言与同样的四种输出。
  columns: 3
  link_label: 阅读指南
  items:
    - title: 文档
      meta: 阅读外壳
      icon: fa-solid fa-book
      desc: >-
        侧栏树来自内容目录或显式的 `data/docs_nav.json`，页内目录、面包屑、翻页、
        编辑与历史链接、反馈与评论——其它一切内容类型复用的就是这套文档外壳。
      url: docs/write/pages/
    - title: 博客与 RSS
      meta: 更新
      icon: fa-solid fa-rss
      desc: >-
        按时间排列的文章、按数量排序的标签面板、按语言分别生成的订阅源，
        以及读起来像发布说明的发布说明。
      url: docs/write/blog/
    - title: 书籍
      meta: 长篇
      icon: fa-solid fa-book-open
      desc: >-
        章节编号，图 / 表 / 式 / 例用 `{#id num=}` 编号、用 `xref` 交叉引用，
        自动生成目录与图表清单，整本书可打印。
      url: docs/write/book/
    - title: 发布与下载
      meta: 发布
      icon: fa-solid fa-download
      desc: >-
        `data/download/*.yaml` 生成发布卡片、资产表与校验和。发布状态——待发布、
        已发布、已归档——是数据，不是一套复制粘贴的仪式。
      url: docs/write/releases/
    - title: Landing 页
      meta: 展示
      icon: fa-solid fa-layer-group
      desc: >-
        `data/home/<lang>.yaml` 用二十一种服务端渲染的分区拼装首页；任何页面加上
        `layout: landing` 也一样。你正在读的这一页就是其中之一。
      url: docs/customize/home/
    - title: API 参考
      meta: OpenAPI
      icon: fa-solid fa-plug
      desc: >-
        Swagger UI 与 Redoc 都是本地运行时。规范文件放在仓库里，与正文并排渲染，
        和站点其它部分一样可以离线工作。
      url: docs/write/openapi/

