# --------------------------------------------------------------- steps ------
start:
  eyebrow: 开始
  title: 三步得到一个双语文档站
  text: >-
    你不必从空目录开始。克隆你正在读的这个站点——它是主题的回归站，
    每个组件与每种页面类型都已经在里面——然后删掉不需要的部分。
  items:
    - title: 克隆本站并预览
      icon: fa-solid fa-code-branch
      desc: >-
        需要 Git、Go 与 Hugo Extended ≥ 0.160.1，不需要 Node.js。预览带实时重载，
        本地检索索引按需生成。
      cmd: { code: 'git clone https://github.com/pgsty/oink.pgsty.com my-docs && cd my-docs && hugo server' }
    - title: 换成你自己的
      icon: fa-solid fa-pen-nib
      desc: >-
        改掉 `hugo.yml` 里的 `baseURL`、`title` 与 `github_repo`，替换 `content/`
        下的页面，保留需要的语言。按[上手指南](docs/start/)的说法，十分钟。
      cmd: { code: 'hugo mod get github.com/pgsty/oink@v0.5.0' }
    - title: 构建并发布 `public/`
      icon: fa-solid fa-cloud-arrow-up
      desc: >-
        一条命令生成整个站点。静态产物可以放到 GitHub Pages、对象存储或普通
        Web 服务器——[部署指南](docs/admin/deploy/)分别讲了怎么做。
      cmd: { code: 'hugo --gc --minify' }

# ---------------------------------------------------------- code-plate ------
config:
  eyebrow: 配置
  title: hugo.yaml —— 全部构建配置
  text: >-
    引入模块，选择输出，打开你要的功能。交互功能默认关闭、站点显式开启；
    被重命名或移除的键会让构建失败并给出新名字——版本之间没有静默漂移。
  aria_label: 一个 OINK 站点最小的 hugo.yaml
  lang: yaml
  code: |
    module:
      imports:
        - path: github.com/pgsty/oink        # 在 go.mod 里固定版本，没有 node_modules

    outputs:                                 # 由站点选择，主题从不替站点决定
      home:    [HTML, RSS, markdown, LLMS]
      page:    [HTML, markdown]
      section: [HTML, RSS, print, markdown]

    params:
      offline_search: true                   # 每种语言一份 Lunr 索引，由 Hugo 生成
      ui:
        dark_mode: true
        image_zoom: true
        keyboard_nav: true                   # w s a d · q e · j k · t · l

# ----------------------------------------------------- pricing-compare ------
compare:
  eyebrow: 横向看
  title: 与其它文档方案的差别
  text: >-
    只列结构性差别，且只写能从各项目自身文档与仓库确认的部分。各项目的版本会变动，
    选型前以其当前文档为准；细节与补充说明见[简介页](docs/about/)。
  feature_label: 维度
  tiers: [OINK, Docsy, Hextra, Docusaurus]
  groups:
    - name: 构建与交付
      rows:
        - { name: 构建工具,                cells: ['Hugo Extended，单个二进制', 'Hugo Extended + Node / npm', 'Hugo', 'Node.js 工具链'] }
        - { name: 消费站点要不要 npm,      cells: [N, Y, N, Y] }
        - { name: 前端资源从哪来,          cells: ['全部提交在主题仓库，VENDOR.json 可审计', 'node_modules 与 CDN', '预编译产物提交在仓库', 'npm 依赖'] }
        - { name: 不联网也能构建,          cells: [Y, N, Y, N] }
    - name: 写作
