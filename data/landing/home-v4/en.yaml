# ---------------------------------------------------------- case-study ------
migration:
  eyebrow: Migration
  title: Moving a large site in, without rewriting it
  text: >-
    SILO's documentation came from another documentation system. Its
    sidebar is not hand-maintained: `data/docs_nav.json` was generated from
    the migration inventory and drives the tree directly.
  stats:
    - { value: 387,   label: upstream pages inventoried }
    - { value: 894,   label: pages live, two languages }
    - { value: 1,     label: JSON file drives the sidebar }
  quote: >-
    silo.pgsty.com is the largest migration case: `data/docs_nav.json` was
    generated from the migration inventory of 387 upstream pages and serves
    as the input of the sidebar tree. It also enables a `module` taxonomy and
    ships a download page.
  source: OINK showcase — silo.pgsty.com
  url: /docs/about/showcase/#silo-pgsty-com

# ------------------------------------------------------------ timeline ------
releases:
  eyebrow: Trajectory
  title: From a Docsy fork to component API v5
  text: >-
    OINK started as a fork of Docsy and evolved into an independent theme.
    Each release is documented, and each migration is a script that reports
    before it rewrites.
  items:
    - date: 2026-08-08
      title: 0.1.0 — A stable local-first foundation
      desc: The Docsy content model kept; the shell, navigation, search and delivery model replaced. Every asset vendored.
      url: /blog/release/0.1.0/   # timeline emits href verbatim, so this stays absolute
    - date: 2026-08-10
      title: 0.2.0 — Richer content and sharper presentation
      desc: Enhanced code blocks, diagrams and charts as local runtimes, and the first Markdown-native component forms.
      url: /blog/release/0.2.0/
    - date: 2026-08-12
      title: 0.3.0 — Authoring, navigation, and a lighter page
      desc: The command palette, keyboard navigation and page actions; a smaller, per-page JavaScript payload.
      url: /blog/release/0.3.0/
    - date: 2026-08-14
      title: 0.4.0 — Scenario components for complete publishing workflows
      desc: Books, releases and downloads, landing pages and reading flows in one release, with migration scripts.
      url: /blog/release/0.4.0/
    - date: 2026-08-18
      title: 0.5.0 — Component API v5 and the converged configuration
      desc: Native forms for every primitive, one attribute policy, one naming namespace, and legacy keys that fail the build with their replacement named.
      url: /blog/release/0.5.0/

# ---------------------------------------------------------- principles ------
principles:
  eyebrow: Principles
  title: What stays true from release to release
  columns: 4
  items:
    - icon: fa-solid fa-plug-circle-xmark
      title: Local first, fail closed
      desc: >-
        Everything a browser needs ships with the theme. A feature that would
        need the network fails the build unless the site configured it.
    - icon: fa-brands fa-markdown
      title: Markdown is the source of truth
      desc: >-
        Components have native Markdown forms first and shortcodes second, so
        content reads correctly with or without the theme.
    - icon: fa-solid fa-sliders
      title: The site decides
      desc: >-
        Outputs, search, comments, zoom and assistant links are opt-in. The
        site owns its content, brand and business components; the theme owns
        the shell.
    - icon: fa-solid fa-triangle-exclamation
      title: Explicit over silent
      desc: >-
        Renamed keys and removed shortcodes fail the build and name their
        replacement. Migrations are scripts that report before they rewrite.

# ----------------------------------------------------------------- faq ------
faq:
  eyebrow: Before you commit
  title: Questions worth asking first
  items:
    - question: Do I need Node.js, npm or a bundler anywhere?
      answer: >-
        No. The consumer site's build dependency is Hugo Extended (0.160.1 or
        newer). Go is used once, to resolve the theme as a Hugo module; an
        offline archive or a Git submodule works without it. Interactive
        features still run JavaScript in the browser — search, the palette,
        charts, tabs — but those scripts are shipped with the theme and
        attached only to the pages that use them.
      open: true
    - question: I have a Docsy site. How hard is the move?
      answer: >-
        OINK keeps Docsy's content model and multilingual behaviour, so
        content and front matter mostly carry over; the shell, navigation,
        search and components are replaced. Renamed keys fail the build with
        the new name, and `scripts/migrations/oink06.py` reports what it would
        rewrite before it writes anything. Read [Upgrade and
        migration](docs/admin/upgrade/).
    - question: Is OINK only for large documentation trees?
      answer: >-
        No. The [showcase](docs/about/showcase/) runs from a two-page project
        site to a fifteen-hundred-file distribution manual, and one site uses
        OINK for landing pages alone. The shell scales down as well as up.
    - question: How does it handle Chinese and other non-Latin content?
      answer: >-
        Local search uses Lunr for Latin scripts and a substring fallback for
        CJK, so Chinese and Japanese pages are searchable without a hosted
        service. English, Simplified Chinese (`zh-cn`, `zh`) and Traditional
        Chinese (`zh-tw`) interface text is human-reviewed; 29 more locales
        share the same key schema. RTL layouts are supported.
    - question: What do AI assistants and crawlers get?
      answer: >-
        With `markdown` in `outputs`, every page has an `index.md` sibling
        announced by `rel="alternate"`, and the `LLMS` format writes a
        site-level `llms.txt` — this site's is at `/llms.txt`. The "open in
        ChatGPT / Claude" page actions exist but are off by default, because
        they hand the reader's URL to a third party.
    - question: What is the license, and where does Docsy stand?
      answer: >-
        Apache License 2.0. OINK is a fork of Docsy that evolved
        independently; Docsy's history, attribution and Apache-2.0
        obligations are preserved, and every vendored runtime is listed with
        its license in `VENDOR.json`. See [License and
        attribution](docs/about/license/).

