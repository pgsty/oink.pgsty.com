# -------------------------------------------------------- capabilities ------
why:
  eyebrow: Why OINK
  title: Four things a Hugo theme does not usually give you
  text: >-
    Most documentation themes are a skin. OINK is a documentation
    <em>system</em>: authoring model, reading shell, output matrix and
    delivery model are designed together, and each is verifiable in this site.
  items:
    - ref: 01 / MARKDOWN NATIVE
      title: Components are Markdown, not a template language
      url: docs/components/
      motto: Readable on GitHub. Complete on the site.
      bullets:
        - >-
          [Callouts](docs/components/callout/) are `> [!NOTE]` blockquotes,
          [steps](docs/components/steps/) and [cards](docs/components/cards/)
          are lists with `{.steps}` / `{.cards}`, a [parameter table](docs/components/fields/)
          is a table plus `{.fields}`, a [figure](docs/components/image/) is
          an image plus `{caption="…"}`.
        - >-
          [Tabs](docs/components/tabs/) are adjacent fences with `{tab="…"}`;
          [file trees](docs/components/filetree/), [galleries](docs/components/gallery/),
          [Mermaid](docs/components/mermaid/) and [ECharts](docs/components/echarts/)
          are data fences named by language.
        - >-
          29 shortcodes cover what a block cannot express — and every one
          validates its parameters at build time, so a typo is a build error,
          not a silent gap in the page.
      value: >-
        Your content survives outside the theme: on GitHub or in any Markdown
        reader it degrades to blockquotes, tables, lists and code blocks.
        Nothing is lost, and nothing is locked in.
      visual:
        type: code
        title: guide.md
        aria_label: Markdown source with a callout, a step list and tabs
        lines:
          - { class: k,  prefix: '> ', text: '[!TIP] One attribute line' }
          - { class: c,  prefix: '> ', text: 'Callouts, steps and tabs stay plain Markdown.' }
          - { text: '' }
          - { class: p,  prefix: '1. ', text: 'Write Markdown' }
          - { class: p,  prefix: '2. ', text: 'Run hugo' }
          - { class: p,  prefix: '3. ', text: 'Deploy public/' }
          - { class: k,  text: '{.steps}' }
          - { text: '' }
          - { class: s,  text: '```bash {tab="macOS"}' }
          - { text: 'brew install hugo' }
          - { class: s,  text: '```' }
          - { class: s,  text: '```bash {tab="Linux"}' }
          - { text: 'apt install hugo' }
          - { class: s,  text: '```' }
    - ref: 02 / HUGO ONLY · LOCAL FIRST
      title: One binary builds everything — offline
      url: docs/about/features/
      motto: No Node. No npm. No CDN. It fails closed rather than phoning home.
      bullets:
        - >-
          The consumer site's build dependency is [Hugo Extended 0.160.1 or
          newer](docs/start/). SCSS compiles inside Hugo; there is no PostCSS,
          webpack or build-time download.
        - >-
          Bootstrap, Font Awesome, four typefaces, Lunr, Mermaid, KaTeX,
          Markmap, Swagger UI, Redoc, Asciinema, ECharts — [28 vendored
          runtimes](docs/about/license/), each recorded in `VENDOR.json` with
          version, source, license and SHA-256, and each loaded only on pages
          that use it.
        - >-
          Anything that would need the network — a PlantUML server, a
          draw.io server, Algolia keys — fails the build unless the site
          configured it explicitly. Nothing connects out on its own.
      value: >-
        One deterministic path from a laptop to CI to production. An
        air-gapped build machine is a supported case, not an edge case.
      visual:
        type: code
        title: ci.log
        aria_label: Build log of a consumer site
        lines:
          - { class: p,  prefix: '$ ', text: 'hugo --gc --minify' }
          - { class: ok, prefix: '✓ ', text: '0 npm packages, 0 build-time requests' }
          - { class: ok, prefix: '✓ ', text: '28 vendored runtimes verified (VENDOR.json)' }
          - { class: ok, prefix: '✓ ', text: '2 languages · search index per language' }
          - { class: ok, prefix: '✓ ', text: 'HTML · print · Markdown · llms.txt' }
          - { class: c,  prefix: '# ', text: 'public/ is ready — host it anywhere' }
    - ref: 03 / A SHELL FOR LARGE SITES
      title: Navigation that holds up at fifteen hundred pages
      url: docs/customize/navigation/
      motto: Sidebar tree, outline, ⌘K palette, keyboard, search — one shell for docs, blog and books
      bullets:
        - >-
          [Local full-text search](docs/customize/search/): Lunr for Latin
          scripts, a substring fallback for CJK; the query never leaves the
          browser. Pages can add `search_boost` and `search_keywords`.
        - >-
          A [command palette](docs/customize/panel/) — `⌘K`, `/` for search,
          `\` for commands — and [single-key navigation](docs/customize/keyboard/):
          `w s a d` on the tree, `q e` for previous/next, `j k` along the
          outline, `t` theme, `l` language.
        - >-
          [32 UI languages](docs/customize/i18n/) with translated-page fallback
          and RTL, a [version menu](docs/customize/versions/) with archive
          banners, dark mode, breadcrumbs, pager, print view — all part of the
          shell, none of it a plugin.
      value: >-
        Reader preferences — theme, language, sidebar width, palette history —
        are stored in the browser and sent nowhere.
      visual:
        type: shell
        brand: OINK
        search: Search or run a command
        shortcut: ⌘ K
        section: Docs
        section_icon: fa-solid fa-book
        items:
          - { label: Introduction }
          - { label: Get started, active: true }
          - { label: Authoring }
          - { label: Components }
          - { label: Customization }
          - { label: Administration }
        eyebrow: ENGINEERING DOCS / LONG HAUL
        title_lines: [Large sites, stay navigable.]
        rules: ['88%', '72%', '55%']
    - ref: 04 / ONE SOURCE · FOUR OUTPUTS
      title: The same page for readers, paper, search engines and AI
      url: docs/customize/agents/
      motto: HTML · Print · Markdown · llms.txt — every component has a defined shape in each
      bullets:
        - >-
          Interactive HTML for readers, and a [print view](docs/customize/print/)
          per section or whole book with controls removed and folds expanded.
        - >-
          An `index.md` beside every page, announced with `rel="alternate"` in
          `<head>`, plus a site-level [`llms.txt`](docs/customize/agents/)
          index — the same content, in the form assistants read best.
        - >-
          The site chooses in `outputs`; the theme never decides for it. The
          "open in ChatGPT / Claude" actions stay off until a site opts in,
          because they hand the current URL to a third party.
      value: >-
        Write once. Ship to a browser, a PDF, a Markdown reader and an agent —
        from one build, with no second toolchain.
      visual:
        type: components
        aria_label: The four output formats
        columns: 2
        items:
          - { icon: fa-solid fa-globe,       title: HTML,      detail: interactive shell }
          - { icon: fa-solid fa-print,       title: Print,     detail: section or whole book, url: docs/customize/print/ }
          - { icon: fa-brands fa-markdown,   title: Markdown,  detail: index.md beside every page, url: docs/customize/agents/ }
          - { icon: fa-solid fa-robot,       title: llms.txt,  detail: site index for assistants, url: docs/customize/agents/ }

# --------------------------------------------------------------- cards ------
content_types:
  eyebrow: Beyond docs
  title: Six kinds of content, one theme
  text: >-
    Documentation sites rarely stay documentation-only. The shapes that
    normally need a second tool are built in and share the shell, the search
    index, the languages and the four outputs.
  columns: 3
  link_label: Read the guide
  items:
    - title: Documentation
      meta: The shell
      icon: fa-solid fa-book
      desc: >-
        Sidebar tree from the content directory or an explicit
        `data/docs_nav.json`, per-page outline, breadcrumbs, pager, edit and
        history links, feedback and comments — the docs shell that everything
        else reuses.
      url: docs/write/pages/
    - title: Blog and RSS
      meta: Updates
      icon: fa-solid fa-rss
      desc: >-
        Dated posts in a timeline, taxonomies with count-sorted tag panels,
        per-language feeds, and release notes that read like release notes.
      url: docs/write/blog/
    - title: Books
      meta: Long-form
      icon: fa-solid fa-book-open
      desc: >-
        Chapter numbers, figures / tables / equations / examples numbered with
        `{#id num=}`, `xref` cross-references, generated tables of contents
        and figure lists, and a whole-book print output.
      url: docs/write/book/
    - title: Releases and downloads
      meta: Publishing
      icon: fa-solid fa-download
      desc: >-
        `data/download/*.yaml` becomes release cards, asset tables and
        checksums. Publication state is data — pending, published, archived —
        not a copy-paste ritual.
      url: docs/write/releases/
    - title: Landing pages
      meta: Presentation
      icon: fa-solid fa-layer-group
      desc: >-
        `data/home/<lang>.yaml` composes the homepage from twenty-one
        server-rendered sections; any page with `layout: landing` does the
        same. This page is one of them.
      url: docs/customize/home/
    - title: API references
      meta: OpenAPI
      icon: fa-solid fa-plug
      desc: >-
        Swagger UI and Redoc as local runtimes. Keep the specification in the
        repository, render it beside the prose, and it works offline like the
        rest of the site.
      url: docs/write/openapi/

