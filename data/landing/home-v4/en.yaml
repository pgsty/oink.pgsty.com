# OINK homepage, iteration 4 (site data only — no theme changes).
#
# Every section below is a stock OINK 0.5.0 landing section (hero, metrics,
# capabilities, cards, logo-wall, steps, code-plate, pricing-compare,
# bar-chart, case-study, timeline, principles, faq, cta) driven by this
# file. Every number and claim is taken from the docs of this site
# (docs/about/, docs/about/features/, docs/about/showcase/) so the page
# stays honest and can be verified by the reader.
#
# Narrative: promise → proof → the four reasons → what is inside →
# how it compares → who runs it → how to start → principles → FAQ → CTA.

sections:
  - hero
  - { type: metrics,         key: facts }
  - { type: capabilities,    key: why }
  - { type: cards,           key: content_types }
  - { type: logo-wall,       key: components }
