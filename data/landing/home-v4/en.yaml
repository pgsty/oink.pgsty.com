  - { type: principles,      key: principles }
  - { type: faq,             key: faq }
  - { type: cta,             key: cta }

# ---------------------------------------------------------------- hero ------
hero:
  eyebrow: OINK 0.5.0 · Open · Indexed · Navigable · Knowledge
  title_lines:
    - Engineering documentation,
    - built with nothing but Hugo.
  title_size: 4.4rem
  lead: >-
    OINK turns a tree of Markdown into a complete documentation system —
    docs, blog, books, release pages and API references — with local
    full-text search, 32 UI languages, versioning, print and agent-readable
    output built in. The only build dependency is Hugo Extended: no Node.js,
    no npm, no CDN, and no network access at build time.
  note: >-
    This page is one YAML file rendered by the theme's stock landing
    sections. No template was written for it.
  note_icon: fa-solid fa-file-code
  image:
    light: images/hero-light.webp
    dark: images/hero-dark.webp
    alt: Markdown content, configuration and vendored assets flowing through one Hugo build into a static documentation site
  actions:
    - label: Get started
      url: docs/start/
      icon: fa-solid fa-rocket
      style: primary
    - label: Browse the components
      url: docs/components/
      icon: fa-solid fa-cubes
      style: ghost
    - label: GitHub
      url: https://github.com/pgsty/oink
      icon: fa-brands fa-github
      style: ghost
      external: true
  detail:
    label: What changed in 0.5.0 — component API v5 and the converged configuration
    url: blog/release/0.5.0/
    icon: fa-solid fa-newspaper

