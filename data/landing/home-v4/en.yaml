# --------------------------------------------------------------- steps ------
start:
  eyebrow: Get started
  title: A bilingual documentation site in three steps
  text: >-
    You do not start from an empty directory. You clone the site you are
    reading — it is the theme's regression site, so every component and page
    type is already in it — and delete what you do not need.
  items:
    - title: Clone this site and preview it
      icon: fa-solid fa-code-branch
      desc: >-
        Requires Git, Go and Hugo Extended ≥ 0.160.1 — no Node.js. The
        preview runs with live reload; the local search index is built on
        demand.
      cmd: { code: 'git clone https://github.com/pgsty/oink.pgsty.com my-docs && cd my-docs && hugo server' }
    - title: Make it yours
      icon: fa-solid fa-pen-nib
      desc: >-
        Change `baseURL`, `title` and `github_repo` in `hugo.yml`, replace the
        pages under `content/`, keep the languages you need. Ten minutes,
        according to the [walkthrough](docs/start/).
      cmd: { code: 'hugo mod get github.com/pgsty/oink@v0.5.0' }
    - title: Build and ship `public/`
      icon: fa-solid fa-cloud-arrow-up
      desc: >-
        One command produces the whole site. Host the static output on GitHub
        Pages, an object store or a plain web server — the [deployment
        guide](docs/admin/deploy/) covers each.
      cmd: { code: 'hugo --gc --minify' }

# ---------------------------------------------------------- code-plate ------
config:
  eyebrow: Configuration
  title: hugo.yaml — the whole build configuration
  text: >-
    Import the module, choose the outputs, switch on the features you want.
    Interactive features are off until a site asks for them, and every
    renamed or removed key fails the build with its replacement named — no
    silent drift between versions.
  aria_label: Minimal hugo.yaml for an OINK site
  lang: yaml
  code: |
    module:
      imports:
        - path: github.com/pgsty/oink        # pinned in go.mod, no node_modules

    outputs:                                 # the site chooses; the theme never does
      home:    [HTML, RSS, markdown, LLMS]
      page:    [HTML, markdown]
      section: [HTML, RSS, print, markdown]

    params:
      offline_search: true                   # Lunr index per language, built by Hugo
      ui:
        dark_mode: true
        image_zoom: true
        keyboard_nav: true                   # w s a d · q e · j k · t · l

