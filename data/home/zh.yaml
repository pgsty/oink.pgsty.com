content_types:
  eyebrow: 不止文档
  title: 六种内容形态，同一套外壳
  text: 文档站很少只有文档，所有内容形态共用同一套外壳、检索与输出。
  columns: 3
  class: td-home-content-types
  items:
    - title: 文档
      meta: 阅读外壳
      icon: fa-solid fa-book
      desc: 侧栏树、页内目录、面包屑、翻页与编辑链接，供其它内容形态复用。
      url: docs/write/pages/
    - title: 博客与 RSS
      meta: 更新
      icon: fa-solid fa-rss
      desc: 按时间排列的文章、四种索引视图、标签面板与分语种订阅源。
      url: docs/write/blog/
    - title: 书籍
      meta: 长篇
      icon: fa-solid fa-book-open
      desc: 章节编号、图表公式 `{#id num=}` 编号、`xref` 引用与整本打印。
      url: docs/write/book/
    - title: Landing 页
      meta: 展示
      icon: fa-solid fa-layer-group
      desc: 用二十二种服务端渲染分区拼装落地页，当前首页就是其中之一。
      url: docs/customize/home/
    - title: Expo 图片相册
      meta: 画册
      icon: fa-solid fa-images
      desc: 页面资源包中的图片收藏，支持展墙、卡片、无缝布局与原图查看器。
      url: docs/write/expo/
    - title: API 参考
      meta: OpenAPI
      icon: fa-solid fa-plug
      desc: Swagger UI 与 Redoc 都是本地运行时，规范放在仓库即可离线浏览。
      url: docs/write/openapi/

