content_types:
  eyebrow: 不止文档
  title: 六种内容形态，同一套外壳
  text: 文档站很少只有文档。那些通常需要第二个工具的内容形态，在这里共用同一套外壳、检索与输出。
  columns: 3
  link_label: 阅读指南
  items:
    - title: 文档
      meta: 阅读外壳
      icon: fa-solid fa-book
      desc: 侧栏树、页内目录、面包屑、翻页、编辑与历史链接——其它内容类型复用的就是这套外壳。
      url: docs/write/pages/
    - title: 博客与 RSS
      meta: 更新
      icon: fa-solid fa-rss
      desc: 按时间排列的文章、按数量排序的标签面板，以及按语言分别生成的订阅源。
      url: docs/write/blog/
    - title: 书籍
      meta: 长篇
      icon: fa-solid fa-book-open
      desc: 章节编号，图表公式用 `{#id num=}` 编号、`xref` 交叉引用，整本可打印。
      url: docs/write/book/
    - title: 发布与下载
      meta: 发布
      icon: fa-solid fa-download
      desc: 一份 `data/download/*.yaml` 生成发布卡片、资产表与校验和，发布状态是数据。
      url: docs/write/releases/
    - title: Landing 页
      meta: 展示
      icon: fa-solid fa-layer-group
      desc: 用二十二种服务端渲染分区拼装页面，你正在读的这一页就是其中之一。
      url: docs/customize/home/
    - title: API 参考
      meta: OpenAPI
      icon: fa-solid fa-plug
      desc: Swagger UI 与 Redoc 都是本地运行时，规范文件放在仓库里，离线可用。
      url: docs/write/openapi/

