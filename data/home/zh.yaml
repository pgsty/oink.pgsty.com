hero:
  eyebrow: 本地优先 · 仅依赖 Hugo 的技术文档主题
  title_lines:
    - words:
        - { text: PGSTY OINK }
  # prettier-ignore
  lead: 继承 Docsy 的功能与 Fumadocs 的设计，<br>提供开箱即用，本地优先的工程文档体验
  image:
    light: images/hero-light.webp
    dark: images/hero-dark.webp
    alt: OINK 工程文档插图
  actions:
    - label: 浏览文档
      url: docs/about/
      icon: fa-solid fa-book-open
      style: primary
    - label: 开始使用
      url: docs/tutorial/
      icon: fa-solid fa-arrow-right
      style: ghost
capabilities:
  eyebrow: 价值主张
  title: 工程文档所需的能力，开箱即用
  # prettier-ignore
  text: 部署、检索，多语言，多版本管理，简洁素雅、本地优先，按需加载所需能力。
  items:
    - ref: 01 / 工程文档
      title: 为工程师与文档站设计
      url: docs/tutorial/
      motto: 从第一次构建到长期维护都没有额外阻力
      bullets:
        - '开箱即用，提供零阻力的[部署上线](docs/deploy/)体验'
        - '自带[全文检索](docs/advanced/search/#local-search-with-lunr)、[i18n](docs/advanced/language/#configure-languages)
          与[多版本支持](docs/advanced/versioning/#adding-a-version-drop-down-menu)'
        - '自带
          [RSS](docs/content/adding-content/#rss-feeds)、[SEO](docs/advanced/analytics/#search-engine-optimization-metadata)
          与 [Google Analytics](docs/advanced/analytics/#adding-analytics) 集成'
      value: 内容团队可以把时间用在文档上，而不是重复搭建站点基础设施。
      visual:
        type: shell
        brand: OINK
        search: 全文检索
        shortcut: ⌘ K
        section: 文档
        section_icon: fa-solid fa-book
        items:
          - { label: 开始使用, active: true }
          - { label: 内容 }
          - { label: 多版本 }
          - { label: 部署 }
        eyebrow: 工程文档 / 快速上线
        title_lines: [开箱即用。, 持续维护。]
        rules: ['88%', '72%', '55%']
    - ref: 02 / 设计与能力
      title: 简洁、素雅、功能齐全
      url: docs/content/lookandfeel/
      motto: 现代文档视觉与成熟内容能力兼得
      bullets:
        - '继承 [Hugo](https://gohugo.io/) [Docsy](https://www.docsy.dev/)
          的强大文档能力'
        - '借鉴参考 [Fumadocs](https://fumadocs.dev/) 的界面审美风格'
        - '针对 [开源项目与工程审美](docs/content/lookandfeel/) 进行优化'
      value: 界面保持克制，成熟文档站所需的功能一项不少。
      visual:
        type: components
        items:
          - {
              icon: fa-solid fa-window-maximize,
              title: FUMADOCS,
              detail: 克制的文档外壳,
            }
          - {
              icon: fa-solid fa-layer-group,
              title: NEXTRA,
              detail: 清晰的内容层级,
            }
          - {
              icon: fa-solid fa-book-open,
              title: DOCSY,
              detail: 成熟的功能底座,
            }
          - {
              icon: fa-solid fa-code-branch,
              title: OPEN SOURCE,
              detail: 面向工程社区,
            }
    - ref: 03 / 本地优先
      title: 本地优先，无外部依赖
      url: docs/about/local-first/
      motto: CSS、JavaScript、字体与运行时全部本地化
      bullets:
        - '一条 [**hugo**](https://gohugo.io/) 命令完成全部构建'
        - '[无需 **npm install** 或 PostCSS
          构建](docs/about/local-first/#what-local-first-covers)'
        - '[所有资源本地提供](docs/about/local-first/#what-local-first-covers)，[断网也能服务](docs/about/local-first/#obtain-an-offline-archive)'
      value: 开发、CI 与生产环境使用同一条可确定的构建路径。
      visual:
        type: code
        aria_label: Hugo 构建示例
        title: build.sh
        lines:
          - { class: c, prefix: '# ', text: 一条命令，一份确定性输出 }
          - { class: p, prefix: '$ ', text: hugo --gc --minify }
          - { class: ok, prefix: '✓ ', text: 本地资源已打包 }
          - { class: ok, prefix: '✓ ', text: 多语言路由已生成 }
          - { class: ok, prefix: '✓ ', text: public/ 可以部署 }
    - ref: 04 / 功能扩展
      title: 功能扩展
      url: docs/content/components/
      motto: 把工程内容需要的表达能力直接带进主题
      bullets:
        - '[Asciinema](docs/content/components/#asciinema)、[ECharts](docs/content/components/#echarts)
          与
          [Infographic](docs/content/components/#infographic)，完整表达工程内容'
        - '[KaTeX](docs/content/diagrams-and-formulae/#latex-support-with-katex)、[Mermaid](docs/content/diagrams-and-formulae/#diagrams-with-mermaid)
          与完整的图表工具箱'
        - '每个[短代码与组件](docs/content/shortcodes/)都有文档，并且只在使用时加载'
      value: 富内容能力属于主题，普通页面不会因此背上额外负担。
      visual:
        type: components
        aria_label: 浏览短代码与内容组件
        columns: 3
        compact: true
        items:
          - {
              icon: fa-solid fa-terminal,
              title: Asciinema,
              url: docs/content/components/#asciinema,
            }
          - {
              icon: fa-solid fa-chart-line,
              title: ECharts,
              url: docs/content/components/#echarts,
            }
          - {
              icon: fa-solid fa-diagram-project,
              title: Infographic,
              url: docs/content/components/#infographic,
            }
          - {
              icon: fa-solid fa-square-root-variable,
              title: KaTeX,
              url: docs/content/diagrams-and-formulae/#latex-support-with-katex,
            }
          - {
              icon: fa-solid fa-share-nodes,
              title: Mermaid,
              url: docs/content/diagrams-and-formulae/#diagrams-with-mermaid,
            }
          - {
              icon: fa-solid fa-sitemap,
              title: Markmap,
              url: docs/content/diagrams-and-formulae/#mind-map-support-with-markmap,
            }
          - {
              icon: fa-solid fa-code-branch,
              title: PlantUML,
              url: docs/content/diagrams-and-formulae/#uml-diagrams-with-plantuml,
            }
          - {
              icon: fa-solid fa-pen-ruler,
              title: Diagrams.net,
              url: docs/content/diagrams-and-formulae/#diagrams-with-diagramsnet,
            }
          - {
              icon: fa-solid fa-file-code,
              title: Swagger UI,
              url: docs/content/shortcodes/#swaggerui,
            }
          - {
              icon: fa-solid fa-book-open,
              title: Redoc,
              url: docs/content/shortcodes/#redoc,
            }
          - {
              icon: fa-solid fa-id-card,
              title: Cards,
              url: docs/content/components/#cards-and-carousel,
            }
          - {
              icon: fa-solid fa-images,
              title: Carousel,
              url: docs/content/components/#cards-and-carousel,
            }

principles:
  eyebrow: 主题原则
  title: 直接、可配置、可长期维护
  items:
    - icon: fa-solid fa-layer-group
      title: 独立品牌
      text: OINK 直接定制 Docsy，不把核心设计藏在增量皮肤后面。
    - icon: fa-solid fa-sliders
      title: 一等配置
      text: 品牌、导航、首页、footer 与组件均使用清晰的站点数据和参数。
    - icon: fa-solid fa-code-branch
      title: 保留上游价值
      text: 保留 Docsy 的成熟能力，也保留从上游摘取修复与新特性的路径。

cta:
  title: 从可运行的双语 Starter 开始。
  text: 复制配置，替换内容，然后只用 Hugo 构建。
  label: 开始使用
  url: docs/tutorial/
  style: primary

