        type: shell
        brand: OINK
        search: 搜索内容或执行命令
        shortcut: ⌘ K
        section: 文档
        section_icon: fa-solid fa-book
        items:
          - { label: 快速上手, active: true }
          - { label: 站点配置 }
          - { label: 组件参考 }
          - { label: 部署 }
