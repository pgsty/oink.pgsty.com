sections:
  - hero
  - type: cards
    key: release
  - capabilities
  - principles
  - cta

hero:
  eyebrow: OINK 0.3.0 · 本地优先 · 仅依赖 Hugo
  title_lines:
    - words:
        - { text: PGSTY OINK }
  # prettier-ignore
  lead: 继承 Docsy 的功能与 Fumadocs 的设计，<br>提供开箱即用，本地优先的工程文档体验
  image:
    light: images/hero-light.webp
    dark: images/hero-dark.webp
    alt: OINK 工程文档插图
  actions:
    - label: 查看 0.3.0 新特性
      url: blog/release/0.3.0/
      icon: fa-solid fa-book-open
      style: primary
    - label: 开始使用
      url: docs/tutorial/
      icon: fa-solid fa-arrow-right
      style: ghost

release:
  eyebrow: OINK 0.3.0
  title: 写得更快，找得更准，页面更轻
  text:
    0.3.0 在保持纯 Hugo
    交付方式不变的前提下，系统提升了日常写作、内容发现与阅读体验。
  columns: 4
  link_label: 了解详情
  items:
    - title: 像文档一样工作的代码
      meta: 写作
      icon: fa-solid fa-code
      desc:
        增强代码块与同步 Code Group
        支持文件名、精确复制、换行、折叠及可分享的选项状态。
      url: docs/components/code-blocks/
    - title: 高频内容组件
      meta: 组件
      icon: fa-solid fa-cubes
      desc:
        Badge、Kbd、Fields、FileTree、Gallery 与 Image Zoom
        以语义化、静态优先的方式覆盖日常文档模式。
      url: docs/components/
    - title: 更有目的的内容发现
      meta: 导航
      icon: fa-solid fa-compass
      desc: 嵌套菜单、加权多语言检索、统一页面操作与命令面板，把读者直接带到正确页面或操作。
      url: docs/advanced/search/#command-palette
    - title: 更轻、更易适配的页面
      meta: 呈现
      icon: fa-solid fa-feather-pointed
      desc:
        语义化字体预设让排版选择更明确；移除 jQuery 后，典型文档页的 CSS 与
        JavaScript 约减少 88 KB。
      url: docs/appearance/typography/
capabilities:
  eyebrow: 价值主张
  title: 工程文档所需的能力，开箱即用
  # prettier-ignore
  text: 部署、检索，多语言，多版本管理，简洁素雅、本地优先，按需加载所需能力。
  items:
    - ref: 01 / 工程文档
      title: 为工程师与文档站设计
      url: docs/tutorial/
      motto: 从第一次构建到长期维护都没有额外阻力
      bullets:
        - '开箱即用，提供零阻力的[部署上线](docs/deploy/)体验'
        - '自带[全文检索](docs/advanced/search/#enable-local-search)、[i18n](docs/configure/language/#configure-languages)
          与[多版本支持](docs/configure/versioning/#adding-a-version-drop-down-menu)'
        - '自带
          [RSS](docs/content/writing/#rss-feeds)、[SEO](docs/advanced/analytics/#search-engine-optimization-metadata)
          与 [Google Analytics](docs/advanced/analytics/#adding-analytics) 集成'
      value: 内容团队可以把时间用在文档上，而不是重复搭建站点基础设施。
      visual:
        type: shell
        brand: OINK
        search: 搜索内容或执行命令
        shortcut: ⌘ K
        section: 文档
        section_icon: fa-solid fa-book
        items:
          - { label: 快速上手, active: true }
          - { label: 站点配置 }
          - { label: 组件参考 }
          - { label: 部署 }
        eyebrow: 工程文档 / 快速上线
        title_lines: [开箱即用。, 持续维护。]
        rules: ['88%', '72%', '55%']
    - ref: 02 / 设计与能力
      title: 简洁、素雅、功能齐全
      url: docs/appearance/styling/
      motto: 现代文档视觉与成熟内容能力兼得
      bullets:
        - '继承 [Hugo](https://gohugo.io/) [Docsy](https://www.docsy.dev/)
          的强大文档能力'
        - '借鉴参考 [Fumadocs](https://fumadocs.dev/) 的界面审美风格'
        - '针对 [开源项目与工程审美](docs/appearance/styling/) 进行优化'
      value: 界面保持克制，成熟文档站所需的功能一项不少。
      visual:
        type: components
        items:
          - {
              icon: fa-solid fa-window-maximize,
              title: FUMADOCS,
              detail: 克制的文档外壳,
            }
          - {
              icon: fa-solid fa-layer-group,
              title: NEXTRA,
              detail: 清晰的内容层级,
            }
          - {
              icon: fa-solid fa-book-open,
              title: DOCSY,
              detail: 成熟的功能底座,
            }
          - {
              icon: fa-solid fa-code-branch,
              title: OPEN SOURCE,
              detail: 面向工程社区,
            }
    - ref: 03 / 本地优先
      title: 本地优先，无外部依赖
      url: docs/about/local-first/
      motto: CSS、JavaScript、字体与运行时全部本地化
      bullets:
        - '一条 [**hugo**](https://gohugo.io/) 命令完成全部构建'
        - '[无需 **npm install** 或 PostCSS
          构建](docs/about/local-first/#what-local-first-covers)'
        - '[所有资源本地提供](docs/about/local-first/#what-local-first-covers)，[断网也能服务](docs/about/local-first/#obtain-an-offline-archive)'
      value: 开发、CI 与生产环境使用同一条可确定的构建路径。
      visual:
        type: code
        aria_label: Hugo 构建示例
        title: build.sh
        lines:
          - { class: c, prefix: '# ', text: 一条命令，一份确定性输出 }
          - { class: p, prefix: '$ ', text: hugo --gc --minify }
          - { class: ok, prefix: '✓ ', text: 本地资源已打包 }
          - { class: ok, prefix: '✓ ', text: 多语言路由已生成 }
          - { class: ok, prefix: '✓ ', text: public/ 可以部署 }
    - ref: 04 / 功能扩展
      title: 功能扩展
      url: docs/components/
      motto: 把工程内容需要的表达能力直接带进主题
      bullets:
        - '[Code
          Group](docs/components/code-blocks/#code-groups)、[FileTree](docs/components/filetree/)
          与 [Fields](docs/components/fields/) 覆盖日常技术写作'
        - '[Gallery](docs/components/gallery/)、[Image
          Zoom](docs/components/image-zoom/) 与图表组件用于视觉化说明'
        - '每个[组件](docs/components/)都有语义化 Markdown
          与打印输出，只在交互确实需要时加载 JavaScript'
      value: 富内容能力属于主题，普通页面不会因此背上额外负担。
      visual:
        type: components
        aria_label: 浏览短代码与内容组件
        columns: 3
        compact: true
        items:
          - {
              icon: fa-solid fa-code,
              title: Code Groups,
              url: docs/components/code-blocks/#code-groups,
            }
          - {
              icon: fa-solid fa-tags,
              title: Badge,
              url: docs/components/badge/,
            }
          - {
              icon: fa-solid fa-keyboard,
              title: Kbd,
              url: docs/components/kbd/,
            }
          - {
              icon: fa-solid fa-list-check,
              title: Fields,
              url: docs/components/fields/,
            }
          - {
              icon: fa-solid fa-folder-tree,
              title: FileTree,
              url: docs/components/filetree/,
            }
          - {
              icon: fa-solid fa-magnifying-glass-plus,
              title: Image Zoom,
              url: docs/components/image-zoom/,
            }
          - {
              icon: fa-solid fa-images,
              title: Gallery,
              url: docs/components/gallery/,
            }
          - {
              icon: fa-solid fa-chart-line,
              title: ECharts,
              url: docs/components/echarts/,
            }
          - {
              icon: fa-solid fa-diagram-project,
              title: Diagrams,
              url: docs/components/diagrams/,
            }
          - {
              icon: fa-solid fa-terminal,
              title: Asciinema,
              url: docs/components/layout/,
            }
          - {
              icon: fa-solid fa-chart-simple,
              title: Infographic,
              url: docs/components/infographic/,
            }
          - {
              icon: fa-solid fa-file-code,
              title: API Docs,
              url: docs/components/layout/,
            }

principles:
  eyebrow: 主题原则
  title: 直接、可配置、可长期维护
  items:
    - icon: fa-solid fa-layer-group
      title: 独立品牌
      text: OINK 直接定制 Docsy，不把核心设计藏在增量皮肤后面。
    - icon: fa-solid fa-sliders
      title: 一等配置
      text: 品牌、导航、首页、footer 与组件均使用清晰的站点数据和参数。
    - icon: fa-solid fa-code-branch
      title: 保留上游价值
      text: 保留 Docsy 的成熟能力，也保留从上游摘取修复与新特性的路径。

cta:
  title: 从可运行的双语 Starter 开始。
  text: 复制配置，替换内容，然后只用 Hugo 构建。
  label: 开始使用
  url: docs/tutorial/
  style: primary

