cases:
  eyebrow: 案例
  title: 十五个站点，同一个家族
  # Items come from content/case/ — see layouts/_partials/landing/sections/case-cards.html
  text: >-
    中文、英文与双语；发行版手册、产品文档、三本书、公司主页、扩展目录，以及一个两页的小工具。每张卡片都会打开线上站点，[案例库](case/) 说明每个站点背后的内容模型。
  columns: 3

faq:
  eyebrow: 选型之前
  title: 值得先问的几个问题
  items:
    - question: 哪里需要 Node.js、npm 或打包器吗？
      answer: >-
        不需要。构建依赖只有 Hugo Extended（0.160.1 或更新）。Go 只用一次，用来把主题解析为
        Hugo Module；离线归档或 Git submodule 方式连 Go 也不需要。界面交互仍在浏览器里执行
        JavaScript，但这些脚本随主题分发，只挂在用到它们的页面上。
      open: true
    - question: 我有一个 Docsy 站，迁移有多难？
      answer: >-
        内容与 front matter 大多可以直接沿用，替换的是外壳、导航、检索与组件。改名的配置键会让
        构建失败并给出新名字，`bin/migrations/oink06.py` 在改写之前先报告它会改什么。
        见[升级与迁移](docs/admin/upgrade/)。
    - question: OINK 只适合大型文档树吗？
      answer: >-
        不是。[样例站点](docs/about/showcase/)里既有两页的项目站，也有一千五百个文件的发行版手册，
        还有一个只用 OINK 做落地页的公司站。外壳向下缩放和向上扩展一样自然。
    - question: 中文与其它非拉丁文字的内容怎么处理？
      answer: >-
        本地检索对拉丁文字用 Lunr、对中日韩文本用子串回退，无需托管服务也能搜索。英语、简体中文
        （`zh-cn`、`zh`）与繁体中文（`zh-tw`）的界面文案经过人工审校，另外 28 种语言共用同一套
        key。支持 RTL 布局。
    - question: AI 助手与爬虫拿到的是什么？
      answer: >-
        `outputs` 里加上 `markdown`，每个页面就有一份 `index.md`，由 `rel="alternate"` 指过去；
        `LLMS` 输出格式在站点根目录写出 `llms.txt`。「在 ChatGPT / Claude 中打开」这类页面动作
        存在，但默认关闭，因为它会把读者的 URL 交给第三方。
    - question: 许可证是什么？和 Docsy 是什么关系？
      answer: >-
        Apache License 2.0。OINK 是 Docsy 的分叉并独立演化；Docsy 的源码历史、署名与 Apache-2.0
        义务完整保留，每个随主题分发的运行时都在 `VENDOR.json` 里连同许可证列出。
        见[开源许可与致谢](docs/about/license/)。

