  title: 工程文档所需的能力，开箱即用
  # prettier-ignore
  text: 让技术内容共用导航、搜索与发布工具。
  items:
    - ref: 01 / 工程文档
      title: 为工程师与文档站设计
      url: docs/start/
      motto: 从可运行的模板开始，逐步完善自己的站点
      bullets:
        - '[Starter 与部署指南](docs/start/)帮助你完成第一个站点'
        - '自带[全文检索](docs/customize/search/)、[i18n](docs/customize/i18n/)、[双列视图](docs/customize/i18n/#bilingual-view)与[多版本](docs/customize/versions/)'
        - '自带 [RSS](docs/write/blog/)、[SEO](docs/admin/analytics/) 与 [Google Analytics](docs/admin/analytics/) 集成'
      value: 内容团队可以把时间用在文档上，而不是重复搭建站点基础设施。
      visual:
        type: shell
        brand: OINK
        search: 搜索内容或执行命令
        shortcut: ⌘ K
        section: 文档
        section_icon: fa-solid fa-book
        items:
          - { label: 快速上手, active: true }
          - { label: 站点配置 }
          - { label: 组件参考 }
          - { label: 部署 }
        eyebrow: 工程文档 / 快速上线
        title_lines: [开箱即用。, 持续维护。]
        rules: ['88%', '72%', '55%']
