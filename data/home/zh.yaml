quickstart:
  eyebrow: 快速开始
  title: 用 AI Agent 帮你建站
  text: 把【】换成你的站点信息，再交给 Claude Code、Codex 或任意编程代理。
  class: td-home-prompt-box
  code: |-
    请基于 Hugo 和 OINK 主题建站，遵循 OINK 建站技能：https://oink.pgsty.com/skill.zh.md
    参考 OINK 文档（https://oink.pgsty.com/zh/docs/）及其中的各种样例，充分利用 OINK 的特性。
    站点信息：【名称、目录、内容与受众、主题、栏目、形式、风格偏好、域名、托管平台……】
  note: '想让每次会话都自动带上这份技能，见[用 AI agent 建站](docs/start/#agent-skill)。'

faq:
  eyebrow: 选型之前
  title: 值得先问的几个问题
  items:
    - question: OINK 1.7.0 有哪些变化？
      answer: >-
        [OINK 1.7.0](release/1.7.0/) 新增六种内容组件（时间线、更新条目、视频、音频、
        帖子与内置 Leaflet 1.9.4 的地图），加入面向富文本编辑器的排版复制，将快捷键
        重构为 29 个单键快捷键与顶层速查表并新增本地浏览历史（`H`）、一键折叠（`O`）、正文宽度调节
        （`-`/`=`）与读者关闭开关；精细打磨四套视觉预设，为 Paper 换上暖白纸面、陶红强调色
        与各预设独立的系统中文排版；并新增 Markmap 导图下载图标、自定义 ECharts 主题与归档版本横幅样式。
    - question: 哪里需要 Node.js、npm 或打包器吗？
      answer: >-
        不需要。站点只依赖任意 edition 的 Hugo（0.169.0+）与纯 CSS 构建，无需 Sass 编译器、
        Node.js、npm 或打包器。Go 1.27.4+ 用来把主题解析为模块；使用离线归档或
        Git submodule 时不需要 Go。浏览器脚本随主题分发，只在用到时加载。
      open: true
    - question: 我有一个 Docsy 站，迁移有多难？
      answer: >-
        内容与 front matter 大多可以直接沿用，替换的是外壳、导航、检索与组件。改名的配置键会告警
        并使用安全回退，`bin/migrations/oink06.py` 在改写之前先报告它会改什么。
        见[升级与迁移](docs/admin/upgrade/)。
    - question: OINK 只适合大型文档树吗？
      answer: >-
        不是。[79 个案例站点](docs/about/showcase/)里既有两页的小工具和个人博客，
        也有近五千页的八语种文档中心、在线书籍与 Expo 影像档案馆。外壳向下缩放和向上扩展一样自然。
    - question: 中文与其它非拉丁文字的内容怎么处理？
      answer: >-
        本地检索采用单一的扫描式 BM25 引擎，对无空格中日韩查询使用重叠二元组、对拉丁词
        支持词边界与词干匹配，不依赖 Lunr 或任何托管服务。OINK
        提供 32 份原生界面语言包、符合当地语言规则的复数形式与已翻译的外观控件，包括英语、
        简体中文（`zh-cn`、`zh`）和繁体中文（`zh-tw`）。支持 RTL 布局。
    - question: 怎样选择风格？可以保留旧版外观吗？
      answer: >-
        点击太阳或月亮按钮打开外观菜单，选择 Paper、Slate、Ink 或 Terminal，
        再独立选择亮色、暗色或跟随系统。Paper 是新默认风格，Slate 保留原有外观。
        本站提供全部四套风格，站点作者通过配置显式指定菜单。
        字体和核心脚本均从本地加载，详见[外观指南](docs/customize/brand/#visual-presets)。
    - question: AI 助手与爬虫拿到的是什么？
      answer: >-
        `outputs` 里加上 `markdown`，每个页面就有一份 `index.md`，由 `rel="alternate"` 指过去；
        `LLMS` 输出格式在站点根目录写出 `llms.txt`。「在 ChatGPT / Claude 中打开」
        这类页面动作存在，但默认关闭，因为它会把读者的 URL 交给第三方。
    - question: 许可证是什么？和 Docsy 是什么关系？
      answer: >-
        Apache License 2.0。OINK 是 Docsy 的分叉并独立演化；Docsy 的源码历史、署名与 Apache-2.0
        义务完整保留，每个随主题分发的运行时都在 `VENDOR.json` 里连同许可证列出。
        见[开源许可与致谢](docs/about/license/)。
    - question: 如何参与贡献？
      answer: >-
        [贡献指南](docs/about/contributing/)说明在哪里报告问题、改进翻译，以及提交主题与测试改动。
        感谢 [@imbajin](docs/about/license/#community-contributors)
        为早期版本贡献阅读体验修复；当前版本继续保留这些修复，并加入双语阅读器。
