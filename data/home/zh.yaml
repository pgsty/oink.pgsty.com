faq:
  eyebrow: 实用问答
  title: 维护者通常最先关心的问题
  items:
    - question: OINK 站点需要 Node.js 或 npm 吗？
      answer:
        不需要。消费站点只用 Hugo Extended 构建。这个项目站仅用 npm
        运行回归、格式与浏览器测试。
      url: docs/about/local-first/
      link_label: 阅读本地优先契约
      open: true
    - question: 现有 Docsy 站点能否逐步迁移？
      answer:
        可以。先固定
        OINK，盘点站点自有覆盖，分阶段迁移配置，并在验证代表性页面时保留别名。
      url: docs/upgrade/migrate-from-docsy/
      link_label: 按迁移指南操作
    - question: 本地优先是否意味着所有可选集成都能离线？
      answer: 不是。主题核心资源保存在本地；分析、评论、远程图表与作者引用的外部媒体仍然是显式网络选择。
      url: docs/about/local-first/#what-local-first-does-not-cover
      link_label: 查看网络边界
    - question: 可以重排或重复首页分区吗？
      answer:
        可以。`sections` 列表控制顺序；映射条目可通过不同的数据 `key`
        重用同一分区类型，无需覆盖模板。
      url: docs/content/configuration/#homepage-and-footer
      link_label: 查看首页数据结构

