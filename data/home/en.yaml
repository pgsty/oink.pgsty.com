hero:
  eyebrow: Local-first · Hugo-only technical documentation
  title_lines:
    - words:
        - { text: PGSTY OINK }
  # prettier-ignore
  lead: Docsy features and Fumadocs design,<br>a Hugo theme for engineering docs.
  image:
    light: images/hero-light.webp
    dark: images/hero-dark.webp
    alt: OINK engineering documentation illustration
  actions:
    - label: Read the docs
      url: docs/about/
      icon: fa-solid fa-book-open
      style: primary
    - label: Get started
      url: docs/tutorial/
      icon: fa-solid fa-arrow-right
      style: ghost
capabilities:
  eyebrow: Why OINK
  title: Docs. Engineered.
  # prettier-ignore
  text: From deployment, search, and version management to rich content, OINK stays clean and local-first, loading only the capabilities each page needs.
  items:
    - ref: 01 / ENGINEERING FIRST
      title: Built for Engineers
      url: docs/tutorial/
      motto: Ship docs, not build pipelines
      bullets:
        - '[Production-ready](docs/deploy/) from day one'
        - '[Full-text search](docs/advanced/search/#local-search-with-lunr),
          [i18n](docs/configure/language/#configure-languages), and
          [versioning](docs/configure/versioning/#adding-a-version-drop-down-menu)
          built in'
        - '[RSS](docs/content/adding-content/#rss-feeds),
          [SEO](docs/advanced/analytics/#search-engine-optimization-metadata),
          and [Google Analytics](docs/advanced/analytics/#adding-analytics)
          ready'
      value: Focus on documentation, not site plumbing.
      visual:
        type: shell
        brand: OINK
        search: Full-text search
        shortcut: ⌘ K
        section: Docs
        section_icon: fa-solid fa-book
        items:
          - { label: Getting started, active: true }
          - { label: Content }
          - { label: Versions }
          - { label: Deployment }
        eyebrow: ENGINEERING DOCS / SHIP FAST
        title_lines: [Ready to use., Built to last.]
        rules: ['88%', '72%', '55%']
    - ref: 02 / CLEAN BY DESIGN
      title: Clean. Complete.
      url: docs/appearance/styling/
      motto: Modern design. Proven foundation.
      bullets:
        - 'User Experience inspired by [Fumadocs](https://fumadocs.dev/) &
          [Hextra](https://imfing.github.io/hextra/)'
        - 'The powerful [Hugo](https://gohugo.io/)
          [Docsy](https://www.docsy.dev/) documentation feature set'
        - '[Look and feel](docs/appearance/styling/) tuned for open source and
          engineering teams'
      value: Quiet interface. Serious capability.
      visual:
        type: components
        items:
          - {
              icon: fa-solid fa-window-maximize,
              title: FUMADOCS,
              detail: restrained docs shell,
            }
          - {
              icon: fa-solid fa-layer-group,
              title: NEXTRA,
              detail: clear content hierarchy,
            }
          - {
              icon: fa-solid fa-book-open,
              title: DOCSY,
              detail: mature feature base,
            }
          - {
              icon: fa-solid fa-code-branch,
              title: OPEN SOURCE,
              detail: built for engineers,
            }
    - ref: 03 / LOCAL FIRST
      title: Hugo. Nothing Else.
      url: docs/about/local-first/
      motto: Everything ships with the theme
      bullets:
        - 'One [**hugo**](https://gohugo.io/) command builds everything'
        - '[No **npm install**. No
          PostCSS.](docs/about/local-first/#what-local-first-covers)'
        - '[All assets local](docs/about/local-first/#what-local-first-covers).
          [Fully offline.](docs/about/local-first/#obtain-an-offline-archive)'
      value: One deterministic path from laptop to production.
      visual:
        type: code
        aria_label: Hugo build example
        title: build.sh
        lines:
          - {
              class: c,
              prefix: '# ',
              text: 'one command, one deterministic output',
            }
          - { class: p, prefix: '$ ', text: hugo --gc --minify }
          - { class: ok, prefix: '✓ ', text: assets bundled locally }
          - { class: ok, prefix: '✓ ', text: multilingual routes built }
          - { class: ok, prefix: '✓ ', text: public/ ready to deploy }
    - ref: 04 / EXTENSIBLE
      title: Content. On Demand.
      url: docs/components/
      motto: First-class components, loaded per page
      bullets:
        - '[Asciinema](docs/components/#asciinema),
          [ECharts](docs/components/#echarts), and
          [Infographic](docs/components/#infographic) for engineering stories'
        - '[KaTeX](docs/content/diagrams-and-formulae/#latex-support-with-katex),
          [Mermaid](docs/content/diagrams-and-formulae/#diagrams-with-mermaid),
          and the complete diagram toolkit'
        - 'Every [shortcode and component](docs/content/shortcodes/) is
          documented and loaded only when needed'
      value: More expression. Zero baggage elsewhere.
      visual:
        type: components
        aria_label: Browse shortcodes and content components
        columns: 3
        compact: true
        items:
          - {
              icon: fa-solid fa-terminal,
              title: Asciinema,
              url: docs/components/#asciinema,
            }
          - {
              icon: fa-solid fa-chart-line,
              title: ECharts,
              url: docs/components/#echarts,
            }
          - {
              icon: fa-solid fa-diagram-project,
              title: Infographic,
              url: docs/components/#infographic,
            }
          - {
              icon: fa-solid fa-square-root-variable,
              title: KaTeX,
              url: docs/content/diagrams-and-formulae/#latex-support-with-katex,
            }
          - {
              icon: fa-solid fa-share-nodes,
              title: Mermaid,
              url: docs/content/diagrams-and-formulae/#diagrams-with-mermaid,
            }
          - {
              icon: fa-solid fa-sitemap,
              title: Markmap,
              url: docs/content/diagrams-and-formulae/#mind-map-support-with-markmap,
            }
          - {
              icon: fa-solid fa-code-branch,
              title: PlantUML,
              url: docs/content/diagrams-and-formulae/#uml-diagrams-with-plantuml,
            }
          - {
              icon: fa-solid fa-pen-ruler,
              title: Diagrams.net,
              url: docs/content/diagrams-and-formulae/#diagrams-with-diagramsnet,
            }
          - {
              icon: fa-solid fa-file-code,
              title: Swagger UI,
              url: docs/content/shortcodes/#swaggerui,
            }
          - {
              icon: fa-solid fa-book-open,
              title: Redoc,
              url: docs/content/shortcodes/#redoc,
            }
          - {
              icon: fa-solid fa-id-card,
              title: Cards,
              url: docs/components/#cards-and-carousel,
            }
          - {
              icon: fa-solid fa-images,
              title: Carousel,
              url: docs/components/#cards-and-carousel,
            }

principles:
  eyebrow: Theme principles
  title: Built to Last.
  items:
    - icon: fa-solid fa-layer-group
      title: Own the Brand
      text: OINK customizes Docsy directly—no add-on skin.
    - icon: fa-solid fa-sliders
      title: Configure Everything
      text: Brand, navigation, homepage, footer, and components are data-driven.
    - icon: fa-solid fa-code-branch
      title: Track Upstream
      text: Keep Docsy's strengths and take upstream fixes cleanly.

cta:
  title: Start with OINK.
  text: Copy the starter. Replace the content. Build with Hugo.
  label: Get started
  url: docs/tutorial/
  style: primary

