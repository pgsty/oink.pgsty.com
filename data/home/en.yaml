principles:
  eyebrow: Operating principles
  title: Predictable from source to production.
  columns: 3
  items:
    - icon: fa-solid fa-box-archive
      title: Local by default
      desc: Theme-owned assets and browser runtimes ship with the module.
    - icon: fa-solid fa-code-branch
      title: Compatible by design
      desc:
        Stable content contracts keep site-owned changes small and reviewable.
    - icon: fa-solid fa-list-check
      title: Evidence at every layer
      desc:
        Source, tests, theme tags, and hosted deployments are verified
        separately.

faq:
  eyebrow: Practical answers
  title: What maintainers usually ask first.
  items:
    - question: Does an OINK site require Node.js or npm?
      answer:
        No. A consuming site builds with Hugo Extended. This project site uses
        npm only for its regression, formatting, and browser test suite.
      url: docs/about/local-first/
      link_label: Read the local-first contract
      open: true
    - question: Can an existing Docsy site migrate incrementally?
      answer:
        Yes. Pin OINK, inventory site-owned overrides, move configuration in
        stages, and preserve aliases while validating representative pages.
      url: docs/upgrade/migrate-from-docsy/
      link_label: Follow the migration guide
    - question: Does local-first mean every optional integration is offline?
      answer:
        No. Core theme assets are local; analytics, comments, remote diagrams,
        and authored external media remain explicit network choices.
      url: docs/about/local-first/#what-local-first-does-not-cover
      link_label: Review network boundaries
    - question: Can I reorder or repeat homepage sections?
      answer:
        Yes. The `sections` list controls order, and a map entry can reuse a
        section type through a different data `key` without overriding a
        template.
      url: docs/content/configuration/#homepage-and-footer
      link_label: See the homepage schema

