content_types:
  eyebrow: Beyond docs
  title: Six kinds of content, one shell
  text: Documentation sites rarely stay docs-only; every shape shares one shell, search and output.
  columns: 3
  class: td-home-content-types
  items:
    - title: Documentation
      meta: The shell
      icon: fa-solid fa-book
      desc: Sidebar tree, page outline, breadcrumbs, pager and edit links reused everywhere.
      url: docs/write/pages/
    - title: Blog and RSS
      meta: Updates
      icon: fa-solid fa-rss
      desc: Dated posts, four index views, tag clouds and a separate RSS feed per language.
      url: docs/write/blog/
    - title: Books
      meta: Long-form
      icon: fa-solid fa-book-open
      desc: Chapter numbers, numbered figures and equations, `xref` links and whole-book print.
      url: docs/write/book/
    - title: Landing pages
      meta: Presentation
      icon: fa-solid fa-layer-group
      desc: Twenty-two server-rendered sections compose a page, including the one you are reading.
      url: docs/customize/home/
    - title: Expo image albums
      meta: Visual
      icon: fa-solid fa-images
      desc: Resource-backed photo collections with wall, cards, seamless views and original zoom.
      url: docs/write/expo/
    - title: API references
      meta: OpenAPI
      icon: fa-solid fa-plug
      desc: Local Swagger UI and Redoc runtimes that render repository specs completely offline.
      url: docs/write/openapi/

