faq:
  eyebrow: Before you commit
  title: Questions worth asking first
  items:
    - question: Do I need Node.js, npm or a bundler anywhere?
      answer: >-
        No. The build dependency is Hugo Extended (0.160.1 or newer). Go is used
        once, to resolve the theme as a Hugo module; an offline archive or a Git
        submodule works without it. Interactive features still run JavaScript,
        but those scripts ship with the theme and attach only to the pages that
        use them.
      open: true
    - question: I have a Docsy site. How hard is the move?
      answer: >-
        Content and front matter mostly carry over; the shell, navigation,
        search and components are replaced. Renamed keys fail the build with the
        new name, and `bin/migrations/oink06.py` reports what it would
        rewrite before it writes anything. Read [Upgrade and
        migration](docs/admin/upgrade/).
    - question: Is OINK only for large documentation trees?
      answer: >-
        No. The [example sites](docs/about/showcase/) run from a two-page project
        site to a fifteen-hundred-file distribution manual, and one uses OINK for
        landing pages alone. The shell scales down as well as up.
    - question: How does it handle Chinese and other non-Latin content?
      answer: >-
        Local search uses Lunr for Latin scripts and a substring fallback for
        CJK, so those pages are searchable without a hosted service. English,
        Simplified Chinese (`zh-cn`, `zh`) and Traditional Chinese (`zh-tw`)
        interface text is human-reviewed; 28 more locales share the same key
        schema. RTL layouts are supported.
    - question: What do AI assistants and crawlers get?
      answer: >-
        With `markdown` in `outputs`, every page has an `index.md` sibling
        announced by `rel="alternate"`, and the `LLMS` format writes a
        site-level `llms.txt`. The "open in ChatGPT / Claude" page actions exist
        but are off by default, because they hand the reader's URL to a third
        party.
    - question: What is the license, and where does Docsy stand?
      answer: >-
        Apache License 2.0. OINK is a fork of Docsy that evolved independently;
        Docsy's history, attribution and Apache-2.0 obligations are preserved,
        and every vendored runtime is listed with its license in `VENDOR.json`.
        See [License and acknowledgements](docs/about/license/).

