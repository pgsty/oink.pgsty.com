sections:
  - hero
  - type: cards
    key: release
  - capabilities
  - principles
  - cta

hero:
  eyebrow: OINK 0.3.0 · Local-first · Hugo-only
  title_lines:
    - words:
        - { text: PGSTY OINK }
  # prettier-ignore
  lead: Docsy features and Fumadocs design,<br>a Hugo theme for engineering docs.
  image:
    light: images/hero-light.webp
    dark: images/hero-dark.webp
    alt: OINK engineering documentation illustration
  actions:
    - label: What's new in 0.3.0
      url: blog/release/0.3.0/
      icon: fa-solid fa-book-open
      style: primary
    - label: Get started
      url: docs/tutorial/
      icon: fa-solid fa-arrow-right
      style: ghost

release:
  eyebrow: OINK 0.3.0
  title: Write faster. Navigate farther. Ship less JavaScript.
  text:
    The 0.3.0 release sharpens the everyday authoring and reading experience
    while preserving the same Hugo-only delivery model.
  columns: 4
  link_label: Explore
  items:
    - title: Code that works like documentation
      meta: Authoring
      icon: fa-solid fa-code
      desc:
        Enhanced fences and synchronized Code Groups add filenames, exact Copy
        behavior, wrapping, collapse, and shareable variants.
      url: docs/components/code-blocks/
    - title: Everyday content primitives
      meta: Components
      icon: fa-solid fa-cubes
      desc:
        Badge, Kbd, Fields, FileTree, Gallery, and Image Zoom cover common
        documentation patterns with semantic, static-first output.
      url: docs/components/
    - title: Navigation with intent
      meta: Discovery
      icon: fa-solid fa-compass
      desc:
        Nested menus, weighted multilingual search, shared page actions, and the
        Command Palette lead readers to the right page or action.
      url: docs/advanced/search/#command-palette
    - title: A lighter, adaptable page
      meta: Presentation
      icon: fa-solid fa-feather-pointed
      desc:
        Semantic typography presets make fonts deliberate, while removing jQuery
        cuts about 88 KB of CSS and JavaScript from a typical docs page.
      url: docs/appearance/typography/
capabilities:
  eyebrow: Why OINK
  title: Docs. Engineered.
  # prettier-ignore
  text: From deployment, search, and version management to rich content, OINK stays clean and local-first, loading only the capabilities each page needs.
  items:
    - ref: 01 / ENGINEERING FIRST
      title: Built for Engineers
      url: docs/tutorial/
      motto: Ship docs, not build pipelines
      bullets:
        - '[Production-ready](docs/deploy/) from day one'
        - '[Full-text search](docs/advanced/search/#enable-local-search),
          [i18n](docs/configure/language/#configure-languages), and
          [versioning](docs/configure/versioning/#adding-a-version-drop-down-menu)
          built in'
        - '[RSS](docs/content/writing/#rss-feeds),
          [SEO](docs/advanced/analytics/#search-engine-optimization-metadata),
          and [Google Analytics](docs/advanced/analytics/#adding-analytics)
          ready'
      value: Focus on documentation, not site plumbing.
      visual:
        type: shell
        brand: OINK
        search: Search or run a command
        shortcut: ⌘ K
        section: Docs
        section_icon: fa-solid fa-book
        items:
          - { label: Get started, active: true }
          - { label: Configuration }
          - { label: Components }
          - { label: Deployment }
        eyebrow: ENGINEERING DOCS / SHIP FAST
        title_lines: [Ready to use., Built to last.]
        rules: ['88%', '72%', '55%']
    - ref: 02 / CLEAN BY DESIGN
      title: Clean. Complete.
      url: docs/appearance/styling/
      motto: Modern design. Proven foundation.
      bullets:
        - 'User Experience inspired by [Fumadocs](https://fumadocs.dev/) &
          [Hextra](https://imfing.github.io/hextra/)'
        - 'The powerful [Hugo](https://gohugo.io/)
          [Docsy](https://www.docsy.dev/) documentation feature set'
        - '[Look and feel](docs/appearance/styling/) tuned for open source and
          engineering teams'
      value: Quiet interface. Serious capability.
      visual:
        type: components
        items:
          - {
              icon: fa-solid fa-window-maximize,
              title: FUMADOCS,
              detail: restrained docs shell,
            }
          - {
              icon: fa-solid fa-layer-group,
              title: NEXTRA,
              detail: clear content hierarchy,
            }
          - {
              icon: fa-solid fa-book-open,
              title: DOCSY,
              detail: mature feature base,
            }
          - {
              icon: fa-solid fa-code-branch,
              title: OPEN SOURCE,
              detail: built for engineers,
            }
    - ref: 03 / LOCAL FIRST
      title: Hugo. Nothing Else.
      url: docs/about/local-first/
      motto: Everything ships with the theme
      bullets:
        - 'One [**hugo**](https://gohugo.io/) command builds everything'
        - '[No **npm install**. No
          PostCSS.](docs/about/local-first/#what-local-first-covers)'
        - '[All assets local](docs/about/local-first/#what-local-first-covers).
          [Fully offline.](docs/about/local-first/#obtain-an-offline-archive)'
      value: One deterministic path from laptop to production.
      visual:
        type: code
        aria_label: Hugo build example
        title: build.sh
        lines:
          - {
              class: c,
              prefix: '# ',
              text: 'one command, one deterministic output',
            }
          - { class: p, prefix: '$ ', text: hugo --gc --minify }
          - { class: ok, prefix: '✓ ', text: assets bundled locally }
          - { class: ok, prefix: '✓ ', text: multilingual routes built }
          - { class: ok, prefix: '✓ ', text: public/ ready to deploy }
    - ref: 04 / EXTENSIBLE
      title: Content. On Demand.
      url: docs/components/
      motto: First-class components, loaded per page
      bullets:
        - '[Code Groups](docs/components/code-blocks/#code-groups),
          [FileTree](docs/components/filetree/), and
          [Fields](docs/components/fields/) for everyday technical writing'
        - '[Gallery](docs/components/gallery/), [Image
          Zoom](docs/components/image-zoom/), and diagrams for visual
          explanations'
        - 'Every [component](docs/components/) has semantic Markdown and print
          output, with JavaScript loaded only when interaction needs it'
      value: More expression. Zero baggage elsewhere.
      visual:
        type: components
        aria_label: Browse shortcodes and content components
        columns: 3
        compact: true
        items:
          - {
              icon: fa-solid fa-code,
              title: Code Groups,
              url: docs/components/code-blocks/#code-groups,
            }
          - {
              icon: fa-solid fa-tags,
              title: Badge,
              url: docs/components/badge/,
            }
          - {
              icon: fa-solid fa-keyboard,
              title: Kbd,
              url: docs/components/kbd/,
            }
          - {
              icon: fa-solid fa-list-check,
              title: Fields,
              url: docs/components/fields/,
            }
          - {
              icon: fa-solid fa-folder-tree,
              title: FileTree,
              url: docs/components/filetree/,
            }
          - {
              icon: fa-solid fa-magnifying-glass-plus,
              title: Image Zoom,
              url: docs/components/image-zoom/,
            }
          - {
              icon: fa-solid fa-images,
              title: Gallery,
              url: docs/components/gallery/,
            }
          - {
              icon: fa-solid fa-chart-line,
              title: ECharts,
              url: docs/components/echarts/,
            }
          - {
              icon: fa-solid fa-diagram-project,
              title: Diagrams,
              url: docs/components/diagrams/,
            }
          - {
              icon: fa-solid fa-terminal,
              title: Asciinema,
              url: docs/components/layout/,
            }
          - {
              icon: fa-solid fa-chart-simple,
              title: Infographic,
              url: docs/components/infographic/,
            }
          - {
              icon: fa-solid fa-file-code,
              title: API Docs,
              url: docs/components/layout/,
            }

principles:
  eyebrow: Theme principles
  title: Built to Last.
  items:
    - icon: fa-solid fa-layer-group
      title: Own the Brand
      text: OINK customizes Docsy directly—no add-on skin.
    - icon: fa-solid fa-sliders
      title: Configure Everything
      text: Brand, navigation, homepage, footer, and components are data-driven.
    - icon: fa-solid fa-code-branch
      title: Track Upstream
      text: Keep Docsy's strengths and take upstream fixes cleanly.

cta:
  title: Start with OINK.
  text: Copy the starter. Replace the content. Build with Hugo.
  label: Get started
  url: docs/tutorial/
  style: primary

footer:
  brand:
    name: PGSTY OINK
    tagline: '**O**pen **I**ndexed，**N**avigable **K**nowledge'
    slogan: A local-first, Hugo theme for engineering documentation
  columns:
    - title: Product
      links:
        - { label: OINK overview, url: docs/about/ }
        - { label: Local-first design, url: docs/about/local-first/ }
        - { label: Architecture, url: docs/about/architecture/ }
        - { label: Configuration, url: docs/configure/overview/ }
    - title: Resources
      links:
        - { label: Documentation, url: docs/ }
        - { label: Get started, url: docs/tutorial/ }
        - { label: Components, url: docs/components/ }
        - { label: Examples, url: docs/about/examples/ }
    - title: Community
      links:
        - { label: Blog, url: blog/ }
        - { label: Contributing, url: docs/about/contributing/ }
        - {
            label: GitHub,
            url: 'https://github.com/pgsty/oink',
            external: true,
          }
        - {
            label: Docsy discussions,
            url: 'https://github.com/google/docsy/discussions',
            external: true,
          }
    - title: About
      links:
        - { label: About OINK, url: docs/about/ }
        - { label: Releases, url: blog/release/ }
        - {
            label: License,
            url: 'https://github.com/pgsty/oink/blob/main/LICENSE',
            external: true,
          }
        - {
            label: Upstream projects,
            url: docs/about/license/#projects-oink-acknowledges,
          }
