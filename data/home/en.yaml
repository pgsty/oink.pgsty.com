  title_lines:
    - words:
        - { text: PGSTY OINK }
  # prettier-ignore
  lead: Docsy features and Fumadocs design,<br>a Hugo theme for engineering docs.
  image:
    light: images/hero-light.webp
    dark: images/hero-dark.webp
    alt: OINK engineering documentation illustration
  actions:
    - label: Read the docs
      url: docs/
      icon: fa-solid fa-book-open
      style: primary
    - label: Get started
      url: docs/tutorial/
      icon: fa-solid fa-arrow-right
      style: ghost

metrics:
  eyebrow: OINK 0.2.0
  title: One theme. A complete documentation surface.
  text:
    The project stays small at build time while covering the paths a technical
    documentation site needs.
  columns: 4
