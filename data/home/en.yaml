faq:
  eyebrow: Before you commit
  title: Questions worth asking first
  items:
    - question: What's new in OINK 1.6.0?
      answer: >-
        [OINK 1.6.0](release/1.6.0/) moves the stylesheet to plain CSS for
        Hugo 0.170+ compatibility, removes Bootstrap JS and Lunr, introduces
        scanning BM25 local search with unspaced CJK queries, automatic split
        indexes, and field anchors, and upgrades Markmap, ReDoc, Mermaid, KaTeX,
        and the rest of the bundled runtimes. Any Hugo edition (0.169.0+) builds
        it with no Sass compiler.
    - question: Do I need Node.js, npm or a bundler anywhere?
      answer: >-
        No. Site builds use Hugo alone (0.169.0 or newer, any edition) and plain
        CSS; no Sass compiler, Node.js, npm, or bundler is required. Go 1.27.4+
        resolves the theme as a module; an offline archive or Git submodule
        works without it. Browser scripts ship with the theme and load only
        where they are used.
      open: true
    - question: I have a Docsy site. How hard is the move?
      answer: >-
        Content and front matter mostly carry over; the shell, navigation,
        search and components are replaced. Renamed keys warn and use the
        documented safe fallback, and `bin/migrations/oink06.py` reports what it would
        rewrite before it writes anything. Read [Upgrade and
        migration](docs/admin/upgrade/).
    - question: Is OINK only for large documentation trees?
      answer: >-
        No. The [45 showcase sites](docs/about/showcase/) run from a two-page
        interactive utility and personal blogs to an eight-language, 5,000-page
        documentation hub, books, and Expo albums. The shell scales down as well
        as up.
    - question: How does it handle Chinese and other non-Latin content?
      answer: >-
        Local search uses a single scanning BM25 engine with overlapping
        bigrams for unspaced CJK queries and word-boundary matching with
        stemming for Latin scripts, without Lunr or any hosted service. OINK
        ships 32 native interface catalogs with locale-aware plurals and
        translated appearance controls, including English, Simplified Chinese (`zh-cn`,
        `zh`) and Traditional Chinese (`zh-tw`). RTL layouts are supported.
    - question: How do I choose a style, and can I keep the old look?
      answer: >-
        Open Appearance from the sun or moon button, choose Paper, Slate, Ink
        or Terminal, then select light, dark or system mode. Paper is the new
        default; Slate preserves the previous look. This site offers all four
        styles. Site owners select the menu explicitly in configuration.
        Fonts and core scripts are served locally. See the
        [appearance guide](docs/customize/brand/#visual-presets).
    - question: What do AI assistants and crawlers get?
      answer: >-
        With `markdown` in `outputs`, every page has an `index.md` sibling
        announced by `rel="alternate"`, and the `LLMS` format writes a
        site-level `llms.txt`. The "open in ChatGPT / Claude" page actions exist
        but are off by default, because they hand the reader's URL to a third
        party.
    - question: What is the license, and where does Docsy stand?
      answer: >-
        Apache License 2.0. OINK is a fork of Docsy that evolved independently;
        Docsy's history, attribution and Apache-2.0 obligations are preserved,
        and every vendored runtime is listed with its license in `VENDOR.json`.
        See [License and acknowledgements](docs/about/license/).
    - question: How can I contribute?
      answer: >-
        The [contribution guide](docs/about/contributing/) explains where to
        report bugs, improve translations, or submit theme and test changes.
        Thank you to [@imbajin](docs/about/license/#community-contributors)
        for the earlier reading repairs; the current release carries those fixes
        forward alongside the bilingual reader.
