            }
          - {
              icon: fa-solid fa-square-root-variable,
              title: KaTeX,
              url: docs/content/diagrams-and-formulae/#latex-support-with-katex,
            }
          - {
              icon: fa-solid fa-share-nodes,
              title: Mermaid,
              url: docs/content/diagrams-and-formulae/#diagrams-with-mermaid,
