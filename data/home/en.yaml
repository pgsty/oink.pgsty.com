  title: Build with coding agent
  text: Replace [...] with your site's details, then paste it into Codex, Claude Code, Antigravity or any coding agent.
  class: td-home-prompt-box
  code: |-
    Build a site with Hugo and the OINK theme, following the OINK site-building skill: https://oink.pgsty.com/skill.md
    Use the OINK docs (https://oink.pgsty.com/docs/) and their examples, and make full use of OINK's features.
