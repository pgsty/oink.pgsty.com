    and RSS. Interactive runtimes ship only on pages that use them.
  layout: grid
  columns: 3
  # Ordered by distinctiveness: the ones you rarely find elsewhere first,
  # then the ones you reach for every day.
  items:
    - { title: ECharts,     icon: fa-solid fa-chart-line,           desc: '`echarts` data fence',           url: docs/components/echarts/ }
    - { title: Infographic, icon: fa-solid fa-chart-pie,            desc: 'declarative data fence',         url: docs/components/infographic/ }
    - { title: Markmap,     icon: fa-solid fa-sitemap,              desc: 'mind maps from headings',        url: docs/components/markmap/ }
    - { title: Asciinema,   icon: fa-solid fa-terminal,             desc: 'terminal casts, local player',   url: docs/components/asciinema/ }
    - { title: PlantUML,    icon: fa-solid fa-project-diagram,      desc: 'UML through your own server',    url: docs/components/plantuml/ }
    - { title: Draw.io,     icon: fa-solid fa-pen-ruler,            desc: 'diagrams that stay editable',    url: docs/components/drawio/ }
    - { title: Mermaid,     icon: fa-solid fa-diagram-project,      desc: 'local diagram runtime',          url: docs/components/mermaid/ }
    - { title: Math,        icon: fa-solid fa-square-root-variable, desc: 'KaTeX at build time',            url: docs/components/math/ }
    - { title: File trees,  icon: fa-solid fa-folder-tree,          desc: '`filetree` data fence',          url: docs/components/filetree/ }
    - { title: Galleries,   icon: fa-solid fa-images,               desc: '`gallery` data fence',           url: docs/components/gallery/ }
    - { title: Code blocks, icon: fa-solid fa-code,                 desc: 'Chroma · lines · copy · fold',   url: docs/components/code/ }
    - { title: Images,      icon: fa-solid fa-image,                desc: 'captions · sizing · zoom',        url: docs/components/image/ }
