content_types:
  eyebrow: Beyond docs
  title: Six kinds of content, one shell
  text:
    Documentation sites rarely stay documentation-only. The shapes that
    normally need a second tool share this one's shell, search and outputs.
  columns: 3
  link_label: Read the guide
  items:
    - title: Documentation
      meta: The shell
      icon: fa-solid fa-book
      desc:
        Sidebar tree, page outline, breadcrumbs, pager, edit and history
        links — the shell every other content type reuses.
      url: docs/write/pages/
    - title: Blog and RSS
      meta: Updates
      icon: fa-solid fa-rss
      desc:
        Dated posts, count-sorted tag panels, and a separate feed for each
        language.
      url: docs/write/blog/
    - title: Books
      meta: Long-form
      icon: fa-solid fa-book-open
      desc:
        Chapter numbers, `{#id num=}` figures and equations, `xref`
        cross-references, and whole-book print.
      url: docs/write/book/
    - title: Releases and downloads
      meta: Publishing
      icon: fa-solid fa-download
      desc:
        One `data/download/*.yaml` becomes release cards, asset tables and
        checksums. Publication state is data.
      url: docs/write/releases/
    - title: Landing pages
      meta: Presentation
      icon: fa-solid fa-layer-group
      desc:
        Twenty-two server-rendered sections compose a page. The one you are
        reading is one of them.
      url: docs/customize/home/
    - title: API references
      meta: OpenAPI
      icon: fa-solid fa-plug
      desc:
        Swagger UI and Redoc as local runtimes. Keep the spec in the
        repository; it works offline.
      url: docs/write/openapi/

components:
