    - { title: Cards,       icon: fa-solid fa-table-cells-large,    desc: 'a list plus `{.cards}`',         url: docs/components/cards/ }
    - { title: Badges,      icon: fa-solid fa-tag,                  desc: 'inline status, five tones',      url: docs/components/badge/ }
    - { title: Keys,        icon: fa-solid fa-keyboard,             desc: 'key names and chords',           url: docs/components/kbd/ }
    - { title: Include,     icon: fa-solid fa-file-import,          desc: 'files, params, build notes',     url: docs/components/include/ }

