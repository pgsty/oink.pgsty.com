capabilities:
  eyebrow: Why OINK
  title: Docs. Engineered.
  # prettier-ignore
  text: Shared navigation, search and publishing tools for your technical content.
  items:
    - ref: 01 / ENGINEERING FIRST
      title: Built for Engineers
      url: docs/start/
      motto: Ship docs, not build pipelines
      bullets:
        - '[Starter and deployment guides](docs/start/) for your first site'
        - '[Search](docs/customize/search/), [i18n](docs/customize/i18n/), [Duo View](docs/customize/i18n/#bilingual-view) and [versioning](docs/customize/versions/) built in'
        - '[RSS](docs/write/blog/), [SEO](docs/admin/analytics/) and [Google Analytics](docs/admin/analytics/) ready'
      value: Focus on documentation, not site plumbing.
      visual:
        type: shell
        brand: OINK
        search: Search or run a command
        shortcut: ⌘ K
        section: Docs
        section_icon: fa-solid fa-book
        items:
          - { label: Get started, active: true }
          - { label: Configuration }
          - { label: Components }
          - { label: Deployment }
        eyebrow: ENGINEERING DOCS / SHIP FAST
        title_lines: [Ready to use., Built to last.]
        rules: ['88%', '72%', '55%']
    - ref: 02 / FOUR STYLES
      title: Four styles. One site.
      url: docs/customize/brand/#visual-presets
      motto: Paper · Slate · Ink · Terminal
      bullets:
        - '[Paper](docs/customize/brand/#visual-presets) feels warm; Slate keeps the technical look'
        - 'Ink uses black, white and red; Terminal pairs mono with sans'
        - 'Set Style and Light separately; both persist across pages'
      value: Same content, a different feel. Fonts and core scripts stay local.
      visual:
        type: components
        aria_label: Four visual styles in OINK
        items:
          - {
              icon: fa-solid fa-file-lines,
              title: Paper,
              detail: warm pages · default,
            }
          - {
              icon: fa-solid fa-layer-group,
              title: Slate,
              detail: the original technical look,
            }
          - {
              icon: fa-solid fa-pen-nib,
              title: Ink,
              detail: black · white · red,
            }
          - {
              icon: fa-solid fa-terminal,
              title: Terminal,
              detail: mono · teal · amber,
            }
    - ref: 03 / LOCAL FIRST
      title: Build with Hugo
      url: docs/about/features/
      motto: Plain CSS, bundled assets, Hugo 0.169+
      bullets:
        - 'One [**hugo**](https://gohugo.io/) command builds everything'
        - '[No **npm install**, Sass compiler, or PostCSS.](docs/about/features/)'
        - '[Local bundled assets](docs/about/features/), ready for [offline builds](docs/start/from-scratch/)'
      value: Hugo Modules need Go for resolution; external integrations remain your choice.
      visual:
        type: code
        aria_label: Hugo build example
        title: build.sh
        lines:
          - {
              class: c,
              prefix: '# ',
              text: 'one command, one deterministic output',
            }
          - { class: p, prefix: '$ ', text: hugo --gc --minify }
          - { class: ok, prefix: '✓ ', text: assets bundled locally }
          - { class: ok, prefix: '✓ ', text: multilingual routes built }
          - { class: ok, prefix: '✓ ', text: public/ ready to deploy }
    - ref: 04 / EXTENSIBLE
      title: Content. On Demand.
      url: docs/components/
      motto: First-class components, loaded per page
      bullets:
        - '[Code Groups](docs/components/tabs/), [FileTree](docs/components/filetree/) and [Fields](docs/components/fields/) for daily writing'
        - '[Gallery](docs/components/gallery/), [Image Zoom](docs/components/image/) and diagrams built in'
        - '[Components](docs/components/) support Markdown and print with fallbacks'
      value: Heavy component engines load on approach, and only on pages that use them.
      visual:
