name: Browser quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: 1.27.3
  HUGO_VERSION: "0.168.0"
  NODE_VERSION: 24
  HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
  GOMODCACHE:
    ${{ github.workspace }}/.hugo_cache/modules/filecache/modules/pkg/mod
  # The browser suites are the theme's integration regressions, so they run
  # against the theme under test, exactly as `make browser` does with the
  # sibling checkout: never a workspace, and pgsty/oink main unless the
  # OINK_THEME_REF repository variable names another branch or tag.
  GOWORK: off
  HUGO_MODULE_WORKSPACE: off
  OINK_THEME_REF: ${{ vars.OINK_THEME_REF || 'main' }}

jobs:
  # One matrix entry per Playwright suite. The `name` values are the published
  # check names, so they must stay stable for branch protection.
  browser:
    name: ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Axe WCAG AA
            target: test:a11y
            artifact: axe
          - name: Responsive shell and mobile menu
            target: test:responsive-shell
            artifact: responsive-shell
          - name: Content components
            target: test:content-components
            artifact: content-components
          - name: Enhanced code blocks
            target: test:code-blocks
            artifact: code-blocks
          - name: Keyboard navigation
            target: test:keyboard-nav
            artifact: keyboard-nav
          - name: PRD5 scenarios
            target: test:prd5
            artifact: prd5
          - name: Section theme colour
            target: test:theme-color
            artifact: theme-color
          - name: Community feedback regressions
            target: test:community-feedback
            artifact: community-feedback
          - name: Visual presets and appearance controls
            target: test:appearance
            artifact: appearance
          - name: Expo albums
            target: test:expo
            artifact: expo
          - name: Blog gallery
            target: test:blog-gallery
            artifact: blog-gallery
          - name: Local PlantUML
            target: test:plantuml
            artifact: plantuml
          - name: Unified diagram reading
            target: test:diagrams
            artifact: diagrams
          - name: Table reader
            target: test:table-reader
            artifact: table-reader
          - name: Duo View
            target: test:compare
            artifact: compare
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - name: Record build tool versions
        run: |
          go version
          hugo version

      # Outside the workspace, so repository scans never see the theme's files.
      - name: Check out the theme under test
        run: |
          git clone --quiet --depth 1 --branch "$OINK_THEME_REF" \
            https://github.com/pgsty/oink.git "$RUNNER_TEMP/oink"
          git -C "$RUNNER_TEMP/oink" log -1 --format='Theme under test: %H %s'
          echo "HUGO_MODULE_REPLACEMENTS=github.com/pgsty/oink -> $RUNNER_TEMP/oink" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run ${{ matrix.suite.target }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.suite.artifact }}-playwright-report
          path: tmp/playwright-report
          if-no-files-found: ignore
