name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: 1.26.6
  HUGO_VERSION: 0.164.0
  NODE_VERSION: 24
  HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
  GOMODCACHE:
    ${{ github.workspace }}/.hugo_cache/modules/filecache/modules/pkg/mod

jobs:
  # `npm test` covers formatting, Markdown style, bilingual coverage, rendered
  # links, Hugo build assertions, alternate-config builds, and the Markdown and
  # favicon goldens. None of it needs a browser, so it runs separately from the
  # Playwright matrix in browser-quality.yml.
  checks:
    name: Formatting, goldens, and build assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Hugo Extended
        run: |
          curl -L -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      - name: Download Hugo module
        run: go mod download github.com/pgsty/oink
      - run: npm ci --ignore-scripts
      - run: npm test
      # Both steps below used to live in the GitHub Pages deploy workflow,
      # which was the site's second, unused publication target -- Cloudflare
      # Pages serves oink.pgsty.com. Deleting that workflow would have taken
      # its only two unique gates with it, so they moved here.
      #
      # The pin gate: go.mod and the version the site advertises in hugo.yml
      # must name the same release, or a bump lands half-applied.
      - name: Verify advertised and pinned release match
        run: node scripts/check-release-pin.mjs
      # The production build: `npm test` builds with `-e dev`, so this is the
      # only place a production-environment build has to survive
      # --panicOnWarning.
      - name: Build as production, strictly
        run: |
          hugo --cleanDestinationDir --gc --minify --environment production \
            --printPathWarnings --panicOnWarning
      # afdocs only fetches the served site (deterministic page sample via
      # agent-docs.config.yml), so the scorecard runs offline against the same
      # dev server the local check:afdocs:dev script targets.
      - name: Agent docs scorecard
        run: |
          npm run _serve -- --disableLiveReload --watch=false &
          timeout 120 bash -c \
            'until curl -sfo /dev/null http://localhost:1313/; do sleep 1; done'
          npm run -s _check:afdocs -- http://localhost:1313
