# cSpell:ignore goldmark markmap plantuml readingtime
#
# baseURL moved to be after params
title: OINK
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
defaultContentLanguage: en

ignoreLogs:
  # Project-documentation pages intentionally override theme parameters.
  - warning-frontmatter-params-overrides # cSpell:disable-line

# Allow iframe-hosted custom themes (for example, Giscus) to load during local previews.
# These headers are only used by `hugo server`; they do not affect generated production files.
server:
  headers:
    - for: /**
      values:
        Access-Control-Allow-Origin: '*'

outputs:
  home: [HTML, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

services:
  googleAnalytics:
    id: G-6JLQEHYFQG

imaging:
  resampleFilter: CatmullRom # cSpell:disable-line

markup:
  tableOfContents:
    endLevel: 4
  goldmark:
    parser:
      # Block images can carry an attribute line ({caption=…}, Book figures).
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
    renderer:
      unsafe: true
  highlight:
    noClasses: false # Required for dark-mode

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: OINK
    params:
      description: A Hugo theme for engineering docs
      comments:
        giscus:
          ariaLabel: Comments
          errorMessage: Comments could not be loaded. Please try again later.
      ui:
        navbar_autohide: true
        command_palette:
          commands:
            - id: theme_issues
              title: OINK issues
              description: Report or review theme and documentation issues
              url: https://github.com/pgsty/oink/issues
              icon: fa-brands fa-github
              keywords: [bug, support, roadmap]
    menus:
      main:
        - identifier: docs
          name: Docs
          pageRef: /docs
          weight: 20
        - identifier: docs-about
          parent: docs
          name: Introduction
          pageRef: /docs/about
          weight: 10
          params:
            icon: fa-solid fa-circle-info
            description: What OINK is, highlights, showcase, and licenses
        - identifier: docs-start
          parent: docs
          name: Get started
          pageRef: /docs/start
          weight: 20
          params:
            icon: fa-solid fa-rocket
            description: Clone this site, preview, make it yours, deploy
        - identifier: docs-write
          parent: docs
          name: Authoring
          pageRef: /docs/write
          weight: 30
          params:
            icon: fa-solid fa-pen-nib
            description: Pages, structure, blog, books, releases, API docs
        - identifier: docs-components
          parent: docs
          name: Components
          pageRef: /docs/components
          weight: 40
          params:
            icon: fa-solid fa-cubes
            description: One page per component, examples first
        - identifier: docs-customize
          parent: docs
          name: Customization
          pageRef: /docs/customize
          weight: 50
          params:
            icon: fa-solid fa-sliders
            description: Brand, navigation, search, languages, versions, print, agents
        - identifier: docs-admin
          parent: docs
          name: Operations
          pageRef: /docs/admin
          weight: 60
          params:
            icon: fa-solid fa-screwdriver-wrench
            description: Preview, deploy, comments, analytics, upgrade
        - identifier: docs-design
          parent: docs
          name: Design
          pageRef: /docs/design
          weight: 70
          params:
            icon: fa-solid fa-compass-drafting
            description: Maintainer contracts for architecture, components, shell, landing, and migration
        - identifier: book
          name: Book
          pageRef: /book
          weight: 30
        - identifier: case
          name: Case
          pageRef: /case
          weight: 40
        - identifier: blog
          name: Blog
          pageRef: /blog
          weight: 50
        - identifier: blog-oink
          parent: blog
          name: OINK engineering
          pageRef: /blog/oink
          weight: 10
          params:
            icon: fa-solid fa-screwdriver-wrench
            description: Design notes and engineering reports from the theme
        - identifier: blog-release
          parent: blog
          name: Releases
          pageRef: /blog/release
          weight: 20
          params:
            icon: fa-solid fa-tags
            description: Version announcements and migration notes
        - identifier: github
          name: GitHub
          url: https://github.com/pgsty/oink
          weight: 90
          params:
            icon: fa-brands fa-github

  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: OINK
    hasCJKLanguage: true
    params:
      description: 为工程而设计的 Hugo 文档主题
      comments:
        giscus:
          ariaLabel: 评论
          errorMessage: 评论加载失败，请稍后重试。
      ui:
        navbar_autohide: true
        command_palette:
          commands:
            # Keep this order aligned with the English catalog: the palette
            # lists commands as configured, so a different order here would
            # give Chinese readers a different command sequence.
            - id: theme_issues
              title: OINK 问题反馈
              description: 报告或查看主题与文档问题
              url: https://github.com/pgsty/oink/issues
              icon: fa-brands fa-github
              keywords: [缺陷, 支持, 路线图]
    menus:
      main:
        - identifier: docs
          name: 文档
          pageRef: /docs
          weight: 20
        - identifier: docs-about
          parent: docs
          name: 简介
          pageRef: /docs/about
          weight: 10
          params:
            icon: fa-solid fa-circle-info
            description: OINK 是什么、亮点特性、示例站点与许可
        - identifier: docs-start
          parent: docs
          name: 快速上手
          pageRef: /docs/start
          weight: 20
          params:
            icon: fa-solid fa-rocket
            description: 克隆本站、本地预览、替换站点信息、部署上线
        - identifier: docs-write
          parent: docs
          name: 创作内容
          pageRef: /docs/write
          weight: 30
          params:
            icon: fa-solid fa-pen-nib
            description: 页面、目录、博客、书籍、发布页与 API 文档
        - identifier: docs-components
          parent: docs
          name: 组件
          pageRef: /docs/components
          weight: 40
          params:
            icon: fa-solid fa-cubes
            description: 一个组件一页，例子在前
        - identifier: docs-customize
          parent: docs
          name: 定制站点
          pageRef: /docs/customize
          weight: 50
          params:
            icon: fa-solid fa-sliders
            description: 品牌、导航、搜索、多语言、多版本、打印与 Agent 输出
        - identifier: docs-admin
          parent: docs
          name: 维护管理
          pageRef: /docs/admin
          weight: 60
          params:
            icon: fa-solid fa-screwdriver-wrench
            description: 本地预览、发布上线、评论、分析与升级
        - identifier: docs-design
          parent: docs
          name: 设计契约
          pageRef: /docs/design
          weight: 70
          params:
            icon: fa-solid fa-compass-drafting
            description: 面向维护者的架构、组件、阅读壳、落地页与迁移契约
        - identifier: book
          name: 教程
          pageRef: /book
          weight: 30
        - identifier: case
          name: 案例
          pageRef: /case
          weight: 40
        - identifier: blog
          name: 博客
          pageRef: /blog
          weight: 50
        - identifier: blog-oink
          parent: blog
          name: OINK 工程实践
          pageRef: /blog/oink
          weight: 10
          params:
            icon: fa-solid fa-screwdriver-wrench
            description: 主题设计记录与工程报告
        - identifier: blog-release
          parent: blog
          name: 版本发布
          pageRef: /blog/release
          weight: 20
          params:
            icon: fa-solid fa-tags
            description: 版本公告与迁移说明
        - identifier: github
          name: GitHub
          url: https://github.com/pgsty/oink
