params:
  # Version related parameters
  #
  # `version` identifies the published site variant (badge, welcome line,
  # version menu) and is not always a git ref. Content that needs a resolvable
  # release ref -- install commands, for example -- uses `tdVersion.latest`.
  tdVersion:
    latest: &tdLatestVers v0.7.1
  version: v0.7.1
  version_menu: v0.7.1
  version_menu_pagelinks: false
  # Populate to enable the navbar version menu, for example:
  versions: # []
    - name: '**Versions**'
    - version: *tdLatestVers
      kind: latest
      url: https://oink.pgsty.com

  hugoMinVersion: &hugoMinVersion 0.160.1
  productionURL: &productionURL https://oink.pgsty.com
  copyright:
    authors: >-
      [Ruohang Feng](https://vonng.com/en) ([@Vonng](https://github.com/Vonng))
      @ [PGSTY](https://pgsty.com/), [CC BY
      4.0](https://creativecommons.org/licenses/by/4.0)
    from_year: 2026
    to_year: present
  footer_center_info: 'Powered by [Oink](https://oink.pgsty.com)'
  github_repo: https://github.com/pgsty/oink.pgsty.com
  github_project_repo: https://github.com/pgsty/oink
  github_subdir: ''
  offline_search: true
  # Keep the search entry points functional in the local Hugo preview used for
  # visual and browser QA, not only in a production build.
  offline_search_on_serve: true
  offline_search_index: summary
  offline_search_summary_length: 70
  offline_search_max_results: 10
  page_width: normal
  comments:
    enable: true
    type: giscus
    giscus:
      repo: pgsty/oink.pgsty.com
      repoId: R_kgDOTzFZAg
      category: Announcements
      categoryId: DIC_kwDOTzFZAs4DDCm-
      mapping: pathname
      strict: 0
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: bottom
      theme: auto
      loading: lazy
  ui:
    typography: technical
    # The blog index toolbar gets the form cycle (list, cards, table) beside
    # its feed button, on the root and on every child section index.
    blog_index_toggle: true
    # Section indexes (`_index.md` without `no_list`) render their children as
    # cards; a section can override with front matter `section_index: list`.
    section_index: cards
    # The blog index is the card grid rather than the row list, since every
    # post here carries section art. The featured-image mode and the share bar
    # are section decisions, so they live in the blog cascades instead.
    blog_index: cards
    blog_index_columns: 3
    # The right-rail cloud lists every declared taxonomy and has no exclude
    # switch, so `authors` and `series` get their own icons rather than the
    # generic fallback they would otherwise share.
    taxonomy_icons:
      categories: fa-solid fa-folder
      tags: fa-solid fa-tags
      authors: fa-solid fa-user-pen
      series: fa-solid fa-layer-group
    quick_links: [docs, blog]
    # Starter sites use the quieter group-only policy explicitly (theme
    # default: all).
    sidebar_icon_policy: groups
    page_context_menu:
      enable: true
      assistant_links: true
      links: []
    dark_mode: true
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_root_enabled: true
    sidebar_root_menu: true
    sidebar_width_min: 200
    sidebar_width_max: 500
    sidebar_item_overflow: ellipsis
    sidebar_menu_truncate: 2000
    sidebar_expand_levels: 2
    feedback:
      enable: false
      reasons: true
    reading_time: false
  plantuml:
    enable: true
    svg_image_url: https://www.plantuml.com/plantuml/svg/
    svg: false
  print:
    toc: true
  markmap: true
  drawio:
    enable: true
    drawio_server: https://embed.diagrams.net/

baseURL: *productionURL

taxonomies:
  tag: tags
  category: categories
  # Declaring these two is the whole switch: `authors` turns the article head
  # into portraits and linked names and makes each term page an author profile;
  # `series` adds the reading-order strip above a post that names one. Neither
  # has a theme parameter -- see docs/customize/taxonomy/#authors.
  author: authors
  series: series

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: *hugoMinVersion
  mounts:
    # English sources and colocated .zh.md translations.
    - source: content
      target: content
      sites: { matrix: { languages: [en, zh] } }
