# cSpell:ignore goldmark markmap plantuml readingtime
#
# baseURL moved to be after params
title: OINK
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
defaultContentLanguage: en

ignoreLogs:
  # Project-documentation pages intentionally override theme parameters.
  - warning-frontmatter-params-overrides # cSpell:disable-line

# Allow iframe-hosted custom themes (for example, Giscus) to load during local previews.
# These headers are only used by `hugo server`; they do not affect generated production files.
server:
  headers:
    - for: /**
      values:
        Access-Control-Allow-Origin: '*'

outputs:
  home: [HTML, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

services:
  googleAnalytics:
    id: G-6JLQEHYFQG

imaging:
  resampleFilter: CatmullRom # cSpell:disable-line

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: OINK
    params:
      description: A Hugo theme for engineering docs
      comments:
        giscus:
          ariaLabel: Comments
          errorMessage: Comments could not be loaded. Please try again later.
      ui:
        command_palette:
          commands:
            - id: theme_issues
              title: OINK issues
              description: Report or review theme and documentation issues
              url: https://github.com/pgsty/oink/issues
              icon: fa-brands fa-github
              keywords: [bug, support, roadmap]
            - id: copy_source
              title: Copy page Markdown
              description: Copy the current page source as Markdown
              action: copy_markdown
              icon: fa-regular fa-copy
              keywords: [copy, source, markdown]
            - id: print_page
              title: Print this page
              description: Open the browser print dialog
              action: print
              icon: fa-solid fa-print
              keywords: [paper, pdf, print]
            - id: choose_theme
              title: Choose color theme
              description: Select automatic, light, or dark appearance
              action: switch_theme
              icon: fa-solid fa-circle-half-stroke
              keywords: [dark, light, appearance]
    menus:
      main:
        - identifier: docs
          name: Docs
          pageRef: /docs
          weight: 20
        - identifier: docs-tutorial
          parent: docs
          name: Tutorials
          pageRef: /docs/tutorial
          weight: 10
          params:
            icon: fa-solid fa-route
            description: Install OINK and build your first documentation site
        - identifier: docs-content
          parent: docs
          name: Content
          pageRef: /docs/content
          weight: 20
          params:
            icon: fa-solid fa-pen-ruler
            description: Author pages, components, diagrams, and API references
        - identifier: docs-advanced
          parent: docs
          name: Advanced
          pageRef: /docs/advanced
          weight: 30
          params:
            icon: fa-solid fa-gears
            description: Configure integrations, deployment, and versioning
        - identifier: blog
          name: Blog
          pageRef: /blog
          weight: 50
        - identifier: blog-oink
          parent: blog
          name: OINK engineering
          pageRef: /blog/oink
          weight: 10
          params:
            icon: fa-solid fa-screwdriver-wrench
            description: Design notes and engineering reports from the theme
        - identifier: blog-release
          parent: blog
          name: Releases
          pageRef: /blog/release
          weight: 20
          params:
            icon: fa-solid fa-tags
            description: Version announcements and migration notes
        - identifier: project
          name: Project
          pageRef: /project
          weight: 70
          params:
            icon: fa-solid fa-diagram-project
        - identifier: issues
          name: Issues
          url: https://github.com/pgsty/oink/issues
          weight: 80
          params:
            icon: fa-regular fa-circle-question
        - identifier: github
          name: GitHub
          url: https://github.com/pgsty/oink
          weight: 90
          params:
            icon: fa-brands fa-github
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: OINK
    params:
      description: 为工程而设计的 Hugo 文档主题
      comments:
        giscus:
          ariaLabel: 评论
          errorMessage: 评论加载失败，请稍后重试。
      time_format_blog: 2006年1月2日
      time_format_default: 2006年1月2日
      links:
        user:
          - name: 使用文档
            url: /zh/docs/
            icon: fa-solid fa-book-open
            desc: 阅读产品指南与参考资料
          - name: 项目博客
            url: /zh/blog/
            icon: fa-solid fa-newspaper
            desc: 阅读 Docsy、OINK 与发布注记
          - name: GitHub Issues
            url: https://github.com/pgsty/oink/issues
            icon: fa-brands fa-github
            desc: 报告主题或文档问题
          - name: Docsy Discussions
            url: https://github.com/google/docsy/discussions
            icon: fa-solid fa-comments
            desc: 讨论上游 Docsy 兼容性
        developer:
          - name: 贡献指南
            url: /zh/docs/about/contributing/
            icon: fa-solid fa-code-fork
            desc: 了解如何参与贡献
          - name: 项目文档与站点信息
            url: /zh/project/
            icon: fa-solid fa-book
            desc: 查阅站点设计文档与资源
          - name: 测试与演示
            url: /zh/tests/
            icon: fa-solid fa-flask
            desc: 查看测试页与功能演示
          - name: GitHub
            url: https://github.com/pgsty/oink
            icon: fa-brands fa-github
            desc: OINK 在这里开放开发
      ui:
        command_palette:
          commands:
            # Keep this order aligned with the English catalog: the palette
            # lists commands as configured, so a different order here would
            # give Chinese readers a different command sequence.
            - id: theme_issues
              title: OINK 问题反馈
              description: 报告或查看主题与文档问题
              url: https://github.com/pgsty/oink/issues
              icon: fa-brands fa-github
              keywords: [缺陷, 支持, 路线图]
            - id: copy_source
              title: 复制页面 Markdown
              description: 将当前页面源码复制为 Markdown
              action: copy_markdown
              icon: fa-regular fa-copy
              keywords: [复制, 源码, Markdown]
            - id: print_page
              title: 打印当前页面
              description: 打开浏览器打印对话框
              action: print
              icon: fa-solid fa-print
              keywords: [打印, 纸张, PDF]
            - id: choose_theme
              title: 选择颜色主题
              description: 选择自动、浅色或深色外观
              action: switch_theme
              icon: fa-solid fa-circle-half-stroke
              keywords: [深色, 浅色, 外观]
        feedback:
          yes: >-
            很高兴本页对你有帮助！欢迎<a
            href="https://github.com/pgsty/oink/issues/new">告诉我们如何继续改进</a>。
          no: >-
            很抱歉本页没有解决问题。请<a
            href="https://github.com/pgsty/oink/issues/new">告诉我们缺少什么</a>。
    menus:
      main:
        - identifier: docs
          name: 文档
          pageRef: /docs
          weight: 20
        - identifier: docs-tutorial
          parent: docs
          name: 教程
          pageRef: /docs/tutorial
          weight: 10
          params:
            icon: fa-solid fa-route
            description: 安装 OINK，并创建你的第一个文档站
        - identifier: docs-content
          parent: docs
          name: 内容创作
          pageRef: /docs/content
          weight: 20
          params:
            icon: fa-solid fa-pen-ruler
            description: 编写页面、组件、图表与 API 参考
        - identifier: docs-advanced
          parent: docs
          name: 高级功能
          pageRef: /docs/advanced
          weight: 30
          params:
            icon: fa-solid fa-gears
            description: 配置集成、部署与版本管理
        - identifier: blog
          name: 博客
          pageRef: /blog
          weight: 50
        - identifier: blog-oink
          parent: blog
          name: OINK 工程实践
          pageRef: /blog/oink
          weight: 10
          params:
            icon: fa-solid fa-screwdriver-wrench
            description: 主题设计记录与工程报告
        - identifier: blog-release
          parent: blog
          name: 版本发布
          pageRef: /blog/release
          weight: 20
          params:
            icon: fa-solid fa-tags
            description: 版本公告与迁移说明
        - identifier: project
          name: 项目
          pageRef: /project
          weight: 70
          params:
            icon: fa-solid fa-diagram-project
        - identifier: issues
          name: 问题反馈
          url: https://github.com/pgsty/oink/issues
          weight: 80
          params:
            icon: fa-regular fa-circle-question
        - identifier: github
          name: GitHub
          url: https://github.com/pgsty/oink
          weight: 90
          params:
            icon: fa-brands fa-github
markup:
  tableOfContents:
    endLevel: 4
  goldmark:
    parser:
      attribute:
        block: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
    renderer:
      unsafe: true
  highlight:
    noClasses: false # Required for dark-mode

params:
  wordmark: logo.svg

  # Version related parameters
  #
  # `version` identifies the published site variant (badge, welcome line,
  # version menu) and is not always a git ref. Content that needs a resolvable
  # release ref -- install commands, for example -- uses `tdVersion.latest`.
  tdVersion:
    latest: &tdLatestVers v0.2.0
  version: v0.2.0
  version_menu: v0.2.0
  version_menu_pagelinks: false
  # Populate to enable the navbar version menu, for example:
  versions: # []
    - name: '**Versions**'
    - version: *tdLatestVers
      kind: latest
      url: https://oink.pgsty.com

  hugoMinVersion: &hugoMinVersion 0.160.1
  productionURL: &productionURL https://oink.pgsty.com
  copyright:
    authors: >-
      [Ruohang Feng](https://vonng.com/en) ([@Vonng](https://github.com/Vonng))
      @ [PGSTY](https://pgsty.com/), [CC BY
      4.0](https://creativecommons.org/licenses/by/4.0)
    from_year: 2026
    to_year: present
  footer_icp: ''
  footer_icp_url: https://beian.miit.gov.cn/
  privacy_policy: https://policies.google.com/privacy
  github_repo: https://github.com/pgsty/oink.pgsty.com
  github_project_repo: https://github.com/pgsty/oink
  github_subdir: ''
  example_site_url: &exampleSiteURL https://example.docsy.dev
  time_format_blog: Monday, January 02, 2006
  time_format_default: January 2, 2006
  rss_sections: [blog]
  offlineSearch: true
  offlineSearchIndex: summary
  offlineSearchSummaryLength: 70
  offlineSearchMaxResults: 10
  prism_syntax_highlighting: false
  page_width: normal
  comments:
    enable: true
    type: giscus
    giscus:
      repo: pgsty/oink.pgsty.com
      repoId: R_kgDOTzFZAg
      category: Announcements
      categoryId: DIC_kwDOTzFZAs4DDCm-
      mapping: pathname
      strict: 0
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: bottom
      theme: auto
      lightTheme: /css/giscus-oink-light.css?v=0.2.0
      darkTheme: /css/giscus-oink-dark.css?v=0.2.0
      loading: lazy
  search:
    # algolia:
  ui:
    quick_links: [docs, blog, project]
    # Starter sites use the quieter group-only policy explicitly. The theme
    # keeps its pre-1.0 compatibility default (`all`) when this is omitted.
    sidebar_icon_policy: groups
    page_context_menu:
      enable: true
      links: []
    # showLightDarkModeMenu param values:
    showLightDarkModeMenu:
      true # default
      # false # disable
      # 'enable-only (experimental)'
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_search_disable: false
    sidebar_root_enabled: true
    sidebar_root_menu: true
    sidebar_width_min: 220
    sidebar_width_max: 480
    sidebar_item_overflow: ellipsis
    sidebar_menu_truncate: 2000
    ul_show: 2
    scrollSpy:
      disable: true
    feedback:
      enable: false
      yes: >-
        Glad to hear it! Please <a
        href="https://github.com/pgsty/oink/issues/new">tell us how we can
        improve</a>.
      no: >-
        Sorry to hear that. Please <a
        href="https://github.com/pgsty/oink/issues/new">tell us how we can
        improve</a>.
    readingtime:
      enable: false
  links:
    user:
      - name: Documentation
        url: /docs/
        icon: fa-solid fa-book-open
        desc: Product guides and reference
      - name: Project blog
        url: /blog/
        icon: fa-solid fa-newspaper
        desc: Docsy, OINK, and release notes
      - name: GitHub Issues
        url: https://github.com/pgsty/oink/issues
        icon: fa-brands fa-github
        desc: Report theme or documentation issues
      - name: Docsy Discussions
        url: https://github.com/google/docsy/discussions
        icon: fa-solid fa-comments
        desc: Discuss upstream Docsy compatibility
    developer:
      - name: Contributing
        url: /docs/about/contributing/
        icon: fa-solid fa-code-fork
        desc: How to contribute
      - name: Project docs and site info
        url: /project/
        icon: fa-solid fa-book
        desc: Site design documentation and resources
      - name: Tests
        url: /tests/
        icon: fa-solid fa-flask
        desc: Test and demo pages
      - name: GitHub
        url: https://github.com/pgsty/oink
        icon: fa-brands fa-github
        desc: OINK development takes place here

  plantuml:
    enable: true
    theme: default
    svg_image_url: https://www.plantuml.com/plantuml/svg/
    svg: false
  print:
    disable_toc: false
  markmap:
    enable: true
  drawio:
    enable: true
    drawio_server: https://embed.diagrams.net/

  # UG helpers: use with _param
  FA: <i class="fa-{1} fa-{2} text-{3} px-1"></i>
  FAS: <i class="fa-solid fa-{1} text-{2} px-1"></i>
  FAS_LG: <i class="fa-solid fa-{1} text-{2} fa-lg"></i>
  # Badge usage: {{% _param BADGE text color %}}
  BADGE: <span class="badge text-bg-{2} rounded-pill text-small">{1}</span>
  btn-lg: class="btn btn-lg btn-{1}" role="button"

baseURL: *productionURL

taxonomies:
  tag: tags
  category: categories

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: *hugoMinVersion
  mounts:
    # English sources and colocated .zh.md translations.
    - source: content
      target: content
      sites: { matrix: { languages: [en, zh] } }
