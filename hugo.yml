# cSpell:ignore goldmark markmap plantuml readingtime
#
# baseURL moved to be after params
title: OINK
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
defaultContentLanguage: en

ignoreLogs:
  # Project-documentation pages intentionally override theme parameters.
  - warning-frontmatter-params-overrides # cSpell:disable-line

# Allow iframe-hosted custom themes (for example, Giscus) to load during local previews.
# These headers are only used by `hugo server`; they do not affect generated production files.
server:
  headers:
    - for: /**
      values:
        Access-Control-Allow-Origin: '*'

outputs:
  home: [HTML, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

services:
  googleAnalytics:
    id: G-6JLQEHYFQG

imaging:
  resampleFilter: CatmullRom # cSpell:disable-line

markup:
  tableOfContents:
    endLevel: 4
  goldmark:
    parser:
      attribute:
        block: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
    renderer:
      unsafe: true
  highlight:
    noClasses: false # Required for dark-mode

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: OINK
    params:
      description: A Hugo theme for engineering docs
      comments:
        giscus:
          ariaLabel: Comments
          errorMessage: Comments could not be loaded. Please try again later.
      ui:
        command_palette:
          commands:
            - id: theme_issues
              title: OINK issues
              description: Report or review theme and documentation issues
              url: https://github.com/pgsty/oink/issues
              icon: fa-brands fa-github
              keywords: [bug, support, roadmap]
    menus:
      main:
        - identifier: docs
          name: Docs
          pageRef: /docs
          weight: 20
        - identifier: docs-tutorial
          parent: docs
          name: Get started
          pageRef: /docs/tutorial
          weight: 10
          params:
            icon: fa-solid fa-rocket
            description: Install OINK and build your first documentation site
        - identifier: docs-configure
          parent: docs
          name: Site configuration
          pageRef: /docs/configure
          weight: 20
          params:
            icon: fa-solid fa-sliders
            description: Menus, languages, versions, and repository links
        - identifier: docs-components
          parent: docs
          name: Components
          pageRef: /docs/components
          weight: 30
          params:
            icon: fa-solid fa-cubes
            description: Code blocks, fields, diagrams, and the rest
        - identifier: docs-deploy
          parent: docs
          name: Deployment
          pageRef: /docs/deploy
          weight: 40
          params:
            icon: fa-solid fa-cloud-arrow-up
            description: Publish to Cloudflare Pages, GitHub Pages, and others
        - identifier: about
          name: About
          pageRef: /docs/about
          weight: 40
        - identifier: about-examples
          parent: about
          name: Example sites
          pageRef: /docs/about/examples
          weight: 10
          params:
            icon: fa-solid fa-star
            description: Sites built with OINK
        - identifier: about-local-first
          parent: about
          name: Local-first
          pageRef: /docs/about/local-first
          weight: 20
          params:
            icon: fa-solid fa-box-archive
            description: Build and browse without hidden network access
        - identifier: about-architecture
          parent: about
          name: Architecture
          pageRef: /docs/about/architecture
          weight: 30
          params:
            icon: fa-solid fa-network-wired
            description: How content and local assets become a static site
        - identifier: about-contributing
          parent: about
          name: Contributing
          pageRef: /docs/about/contributing
          weight: 40
          params:
            icon: fa-solid fa-code-pull-request
            description: Contribute code and bilingual documentation
        - identifier: blog
          name: Blog
          pageRef: /blog
          weight: 50
        - identifier: blog-oink
          parent: blog
          name: OINK engineering
          pageRef: /blog/oink
          weight: 10
          params:
            icon: fa-solid fa-screwdriver-wrench
            description: Design notes and engineering reports from the theme
        - identifier: blog-release
          parent: blog
          name: Releases
          pageRef: /blog/release
          weight: 20
          params:
            icon: fa-solid fa-tags
            description: Version announcements and migration notes
        - identifier: github
          name: GitHub
          url: https://github.com/pgsty/oink
          weight: 90
          params:
            icon: fa-brands fa-github

  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: OINK
    params:
      description: 为工程而设计的 Hugo 文档主题
      comments:
        giscus:
          ariaLabel: 评论
          errorMessage: 评论加载失败，请稍后重试。
      time_format_blog: 2006年1月2日
      time_format_default: 2006年1月2日
      links:
        user:
          - name: 使用文档
            url: /zh/docs/
            icon: fa-solid fa-book-open
            desc: 阅读产品指南与参考资料
          - name: 项目博客
            url: /zh/blog/
            icon: fa-solid fa-newspaper
            desc: 阅读 Docsy、OINK 与发布注记
          - name: GitHub Issues
            url: https://github.com/pgsty/oink/issues
            icon: fa-brands fa-github
            desc: 报告主题或文档问题
          - name: Docsy Discussions
            url: https://github.com/google/docsy/discussions
            icon: fa-solid fa-comments
            desc: 讨论上游 Docsy 兼容性
        developer:
          - name: 贡献指南
            url: /zh/docs/about/contributing/
            icon: fa-solid fa-code-fork
            desc: 了解如何参与贡献
          - name: 站点源码
            url: https://github.com/pgsty/oink.pgsty.com
            icon: fa-brands fa-github
            desc: 查看本站内容、测试与发布配置
          - name: 测试与演示
            url: /zh/tests/
            icon: fa-solid fa-flask
            desc: 查看测试页与功能演示
          - name: GitHub
            url: https://github.com/pgsty/oink
            icon: fa-brands fa-github
            desc: OINK 在这里开放开发
      ui:
        command_palette:
          commands:
            # Keep this order aligned with the English catalog: the palette
            # lists commands as configured, so a different order here would
            # give Chinese readers a different command sequence.
            - id: theme_issues
              title: OINK 问题反馈
              description: 报告或查看主题与文档问题
              url: https://github.com/pgsty/oink/issues
              icon: fa-brands fa-github
              keywords: [缺陷, 支持, 路线图]
        feedback:
          yes: >-
            很高兴本页对你有帮助！欢迎<a
            href="https://github.com/pgsty/oink/issues/new">告诉我们如何继续改进</a>。
          no: >-
            很抱歉本页没有解决问题。请<a
            href="https://github.com/pgsty/oink/issues/new">告诉我们缺少什么</a>。
    menus:
      main:
        - identifier: docs
          name: 文档
          pageRef: /docs
          weight: 20
        - identifier: docs-tutorial
          parent: docs
          name: 快速上手
          pageRef: /docs/tutorial
          weight: 10
          params:
            icon: fa-solid fa-rocket
            description: 安装 OINK，并创建你的第一个文档站
        - identifier: docs-configure
          parent: docs
          name: 站点配置
          pageRef: /docs/configure
          weight: 20
          params:
            icon: fa-solid fa-sliders
            description: 菜单、多语言、版本管理与仓库链接
        - identifier: docs-components
          parent: docs
          name: 组件参考
          pageRef: /docs/components
          weight: 30
          params:
            icon: fa-solid fa-cubes
            description: 代码块、Fields、图表等全部组件
        - identifier: docs-deploy
          parent: docs
          name: 部署
          pageRef: /docs/deploy
          weight: 40
          params:
            icon: fa-solid fa-cloud-arrow-up
            description: 发布到 Cloudflare Pages、GitHub Pages 及其他托管
        - identifier: about
          name: 关于
          pageRef: /docs/about
          weight: 40
        - identifier: about-examples
          parent: about
          name: 示例站点
          pageRef: /docs/about/examples
          weight: 10
          params:
            icon: fa-solid fa-star
            description: 用 OINK 搭建的站点
        - identifier: about-local-first
          parent: about
          name: 本地优先
          pageRef: /docs/about/local-first
          weight: 20
          params:
            icon: fa-solid fa-box-archive
            description: 构建与浏览都不依赖隐式网络访问
        - identifier: about-architecture
          parent: about
          name: 架构概览
          pageRef: /docs/about/architecture
          weight: 30
          params:
            icon: fa-solid fa-network-wired
            description: 内容与本地资源如何变成静态站点
        - identifier: about-contributing
          parent: about
          name: 贡献指南
          pageRef: /docs/about/contributing
          weight: 40
          params:
            icon: fa-solid fa-code-pull-request
            description: 参与代码与双语文档贡献
        - identifier: blog
          name: 博客
          pageRef: /blog
          weight: 50
        - identifier: blog-oink
          parent: blog
          name: OINK 工程实践
          pageRef: /blog/oink
          weight: 10
          params:
            icon: fa-solid fa-screwdriver-wrench
            description: 主题设计记录与工程报告
        - identifier: blog-release
          parent: blog
          name: 版本发布
          pageRef: /blog/release
          weight: 20
          params:
            icon: fa-solid fa-tags
            description: 版本公告与迁移说明
        - identifier: github
          name: GitHub
          url: https://github.com/pgsty/oink
          weight: 90
          params:
            icon: fa-brands fa-github

params:
  wordmark: logo.svg

  # Version related parameters
  #
  # `version` identifies the published site variant (badge, welcome line,
  # version menu) and is not always a git ref. Content that needs a resolvable
  # release ref -- install commands, for example -- uses `tdVersion.latest`.
  tdVersion:
    latest: &tdLatestVers v0.3.0
  version: v0.3.0
  version_menu: v0.3.0
  version_menu_pagelinks: false
  # Populate to enable the navbar version menu, for example:
  versions: # []
    - name: '**Versions**'
    - version: *tdLatestVers
      kind: latest
      url: https://oink.pgsty.com

  hugoMinVersion: &hugoMinVersion 0.160.1
  productionURL: &productionURL https://oink.pgsty.com
  copyright:
    authors: >-
      [Ruohang Feng](https://vonng.com/en) ([@Vonng](https://github.com/Vonng))
      @ [PGSTY](https://pgsty.com/), [CC BY
      4.0](https://creativecommons.org/licenses/by/4.0)
    from_year: 2026
    to_year: present
  footer_center_info: 'Powered by [Oink](https://oink.pgsty.com)'
  privacy_policy: https://policies.google.com/privacy
  github_repo: https://github.com/pgsty/oink.pgsty.com
  github_project_repo: https://github.com/pgsty/oink
  github_subdir: ''
  example_site_url: &exampleSiteURL https://example.docsy.dev
  time_format_blog: Monday, January 02, 2006
  time_format_default: January 2, 2006
  rss_sections: [blog]
  offlineSearch: true
  offlineSearchIndex: summary
  offlineSearchSummaryLength: 70
  offlineSearchMaxResults: 10
  prism_syntax_highlighting: false
  page_width: normal
  comments:
    enable: true
    type: giscus
    giscus:
      repo: pgsty/oink.pgsty.com
      repoId: R_kgDOTzFZAg
      category: Announcements
      categoryId: DIC_kwDOTzFZAs4DDCm-
      mapping: pathname
      strict: 0
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: bottom
      theme: auto
      lightTheme: /css/giscus-oink-light.css?v=0.3.0
      darkTheme: /css/giscus-oink-dark.css?v=0.3.0
      loading: lazy
  search:
    # algolia:
  ui:
    typography:
      preset: technical
    quick_links: [docs, blog]
    # Starter sites use the quieter group-only policy explicitly. The theme
    # keeps its pre-1.0 compatibility default (`all`) when this is omitted.
    sidebar_icon_policy: groups
    page_context_menu:
      enable: true
      assistant_links: true
      links: []
    # showLightDarkModeMenu param values:
    showLightDarkModeMenu:
      true # default
      # false # disable
      # 'enable-only (experimental)'
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_search_disable: false
    sidebar_root_enabled: true
    sidebar_root_menu: true
    sidebar_width_min: 220
    sidebar_width_max: 480
    sidebar_item_overflow: ellipsis
    sidebar_menu_truncate: 2000
    ul_show: 2
    scrollSpy:
      disable: true
    feedback:
      enable: false
      yes: >-
        Glad to hear it! Please <a
        href="https://github.com/pgsty/oink/issues/new">tell us how we can
        improve</a>.
      no: >-
        Sorry to hear that. Please <a
        href="https://github.com/pgsty/oink/issues/new">tell us how we can
        improve</a>.
    readingtime:
      enable: false
  links:
    user:
      - name: Documentation
        url: /docs/
        icon: fa-solid fa-book-open
        desc: Product guides and reference
      - name: Project blog
        url: /blog/
        icon: fa-solid fa-newspaper
        desc: Docsy, OINK, and release notes
      - name: GitHub Issues
        url: https://github.com/pgsty/oink/issues
        icon: fa-brands fa-github
        desc: Report theme or documentation issues
      - name: Docsy Discussions
        url: https://github.com/google/docsy/discussions
        icon: fa-solid fa-comments
        desc: Discuss upstream Docsy compatibility
    developer:
      - name: Contributing
        url: /docs/about/contributing/
        icon: fa-solid fa-code-fork
        desc: How to contribute
      - name: Site source
        url: https://github.com/pgsty/oink.pgsty.com
        icon: fa-brands fa-github
        desc: Review this site's content, tests, and deployment configuration
      - name: Tests
        url: /tests/
        icon: fa-solid fa-flask
        desc: Test and demo pages
      - name: GitHub
        url: https://github.com/pgsty/oink
        icon: fa-brands fa-github
        desc: OINK development takes place here

  plantuml:
    enable: true
    theme: default
    svg_image_url: https://www.plantuml.com/plantuml/svg/
    svg: false
  print:
    disable_toc: false
  markmap:
    enable: true
  drawio:
    enable: true
    drawio_server: https://embed.diagrams.net/

  # UG helpers: use with _param
  FA: <i class="fa-{1} fa-{2} text-{3} px-1"></i>
  FAS: <i class="fa-solid fa-{1} text-{2} px-1"></i>
  FAS_LG: <i class="fa-solid fa-{1} text-{2} fa-lg"></i>
  # Badge usage: {{% _param BADGE text color %}}
  BADGE: <span class="badge text-bg-{2} rounded-pill text-small">{1}</span>
  btn-lg: class="btn btn-lg btn-{1}" role="button"

baseURL: *productionURL

taxonomies:
  tag: tags
  category: categories

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: *hugoMinVersion
  mounts:
    # English sources and colocated .zh.md translations.
    - source: content
      target: content
      sites: { matrix: { languages: [en, zh] } }
